<title>Garagebook</title>

<style>
/* Layout: one narrow column, a big bike card up top, a floating menu bar at the bottom for one-handed use.
   One accent colour (--accent, the dark blue). --tint is a light version of it. Green, orange and red only mark status.
   The page is always light, also when the phone is in dark mode. */
:root {
  --bg: #F3F4F7; --surface: #ffffff; --sunk: #ECEEF5; --fg: #0F1736; --muted: #4B5375; --line: #E1E4EE;
  --accent: #0F1736; --accent-fg: #ffffff; --tint: #DFE3F2; --nav: #0F1736; --ok: #1F7A4D; --soon: #B25E00; --over: #B42318;
  --display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  --r: 20px; color-scheme: light;
}

* { box-sizing: border-box }
html, body { background: var(--bg); color: var(--fg) }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100% }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 620px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(104px + env(safe-area-inset-bottom, 0px)) }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -.02em; margin: 0; text-wrap: balance }
h2 { font-size: 22px }
h3 { font-size: 18px }
.num { font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.small { font-size: 13px }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: 12px 10px }
.top select { flex: 1; min-width: 0; font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -.02em; background: none; border: 0; padding: 0; appearance: none; -webkit-appearance: none; text-overflow: ellipsis }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; border: 0; min-height: 36px; background: var(--surface); white-space: nowrap }
.chip .dot { width: 8px; height: 8px; border-radius: 50% }
.chip.dirty { color: var(--soon) }
.banner { border-radius: var(--r); padding: 12px 14px; background: var(--sunk); font-size: 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap }
.banner.example { border: 1px dashed var(--muted) }

/* Sections */
section { display: flex; flex-direction: column; gap: 12px; margin-top: 18px }
.card { background: var(--surface); border-radius: var(--r); padding: 16px 18px }

/* Bike card: the engine size in big light digits behind the name, then the bike, then the two main buttons */
.hero { position: relative; overflow: hidden; border-radius: 24px; padding: 20px 18px; display: flex; flex-direction: column; gap: 12px }
.hero > * { position: relative }
.hero .heronum { position: absolute; right: -10px; top: -22px; font: 700 clamp(120px, 44vw, 190px)/1 var(--display); color: var(--tint); letter-spacing: -.05em; pointer-events: none; user-select: none }
.hero .heronum.n4 { font-size: clamp(92px, 33vw, 150px); top: -14px }
.hero h1 { font-size: clamp(38px, 13vw, 56px); line-height: .92; letter-spacing: -.03em; overflow-wrap: anywhere }
.tags { display: flex; gap: 6px; flex-wrap: wrap }
.tag { background: var(--sunk); font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 999px }
.tag.on { background: var(--accent); color: var(--accent-fg) }
.bikeart { display: block; width: 100%; height: auto; color: var(--accent) }
.hero .btn { width: 100% }
.stat.dark { background: var(--accent); color: var(--accent-fg) }
.stat.dark .label, .stat.dark .sub { color: color-mix(in srgb, var(--accent-fg) 72%, transparent) }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.stat .label { font-size: 12px; color: var(--muted) }
.stat .value { font-family: var(--display); font-size: 28px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1 }
.stat .sub { font-size: 12px; color: var(--muted) }

/* Odometer gauge */
.odo { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px }
.odo .digits { display: flex; gap: 3px }
.odo .digits span { font-family: var(--display); font-weight: 600; font-size: 40px; line-height: 1; background: var(--fg); color: var(--bg); border-radius: 5px; padding: 6px 4px 4px; min-width: 28px; text-align: center; font-variant-numeric: tabular-nums }
.odo .unit { font-family: var(--display); font-size: 20px; color: var(--muted) }

/* Job rows */
.jobs { display: flex; flex-direction: column }
.job { display: grid; grid-template-columns: 32px 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line) }
.job:first-child { border-top: 0 }
.job .icon { grid-row: span 2; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--sunk); color: var(--muted) }
.job.due .icon { background: color-mix(in srgb, var(--soon) 18%, transparent); color: var(--soon) }
.job .icon svg { width: 18px; height: 18px }
.job button.icon { border: 0; padding: 0; cursor: pointer; font: inherit }
.job button.icon:active { transform: scale(.92) }
.job .name { font-weight: 500; min-width: 0 }
.job .when { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap }
.bar { grid-column: 2 / 4; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--ok) }
.bar i.soon { background: var(--soon) } .bar i.over { background: var(--over) }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 8px; white-space: nowrap }
.pill.over { background: color-mix(in srgb, var(--over) 16%, transparent); color: var(--over) }
.pill.soon { background: color-mix(in srgb, var(--soon) 18%, transparent); color: var(--soon) }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok) }

/* Lists and forms */
.rows { display: flex; flex-direction: column }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center }
.row:first-child { border-top: 0 }
.row > div { min-width: 0 }
.row .t { font-weight: 500; overflow-wrap: anywhere }
.row.tap { cursor: pointer }
.row .warn { color: var(--soon); font-size: 12px }
form, .form { display: flex; flex-direction: column; gap: 10px }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted) }
label.f input, label.f select, label.f textarea { font-size: 16px; color: var(--fg); background: var(--sunk); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; width: 100%; min-width: 0 }
.fields2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px }
.fields2 > * { min-width: 0 }
/* iPhone Safari gives date fields their own minimum width, height and centred text; make them match the others. */
label.f input, label.f select { height: 44px; line-height: 22px }
label.f input[type="date"] { -webkit-appearance: none; appearance: none; display: block; max-width: 100%; text-align: left }
label.f input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0 }
label.f input[type="date"]::-webkit-calendar-picker-indicator { margin: 0 }
.check { display: flex; gap: 10px; align-items: center; font-size: 15px; color: var(--fg) }
.check input { width: 20px; height: 20px; accent-color: var(--accent) }
.btn { border: 0; border-radius: 999px; min-height: 48px; padding: 12px 20px; font-weight: 700; background: var(--accent); color: var(--accent-fg) }
.btn.ghost { background: var(--sunk); color: var(--fg) }
.btn.danger { background: none; color: var(--over); padding-inline: 0; min-height: 0 }
.btn:disabled { opacity: .45 }
.btns { display: flex; gap: 10px; flex-wrap: wrap }
.btns .btn { flex: 1 }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600 }

/* Task picker */
.tasks { display: flex; flex-direction: column; max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 9px; background: var(--sunk) }
.task { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 15px; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100% }
.task:first-child { border-top: 0 }
.task .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--muted); flex: none; display: grid; place-items: center }
.task.on .box { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }
.task .every { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap }

/* Bottom tabs */
nav.tabs { position: fixed; z-index: 6; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); max-width: 600px; margin-inline: auto; background: var(--nav); border-radius: 26px; display: grid; grid-template-columns: repeat(6, 1fr); padding: 6px }
nav.tabs button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 600; color: rgba(255, 255, 255, .5); padding: 6px 0; min-height: 48px; justify-content: center }
nav.tabs button svg { width: 22px; height: 22px }
.rfact, .ritem { padding: 10px 0; border-bottom: 1px solid var(--line) }
.rfact:last-child, .ritem:last-child { border-bottom: 0 }
.rtitle { font-weight: 600; margin-bottom: 2px; overflow-wrap: anywhere }
.rtitle a { color: inherit }
.rtag { color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 99px; letter-spacing: .03em; vertical-align: middle }
.rpick { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left; background: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 4px 0; color: inherit; font: inherit }
.rpick.on { border-color: var(--accent); background: var(--sunk) }
.rgen { display: block; width: 100%; height: auto; border-radius: 8px; margin: 6px 0; background: #fff }
.rimgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding: 10px 0 }
.rimg { display: flex; flex-direction: column; gap: 3px; color: inherit; text-decoration: none; min-width: 0 }
.rimg img { width: 100%; height: 110px; object-fit: contain; background: var(--line); border-radius: 8px }
.rimg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.btn.small { padding: 6px 14px; font-size: 13px; margin-top: 6px; min-height: 36px }
nav.tabs button { min-width: 0; overflow: hidden; text-overflow: ellipsis }
nav.tabs button[aria-current="page"] { color: #fff }
nav.tabs button:focus-visible { outline-color: #fff; outline-offset: -2px; border-radius: 20px }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, #000 45%, transparent); display: flex; align-items: flex-end; justify-content: center }
.sheet { background: var(--bg); width: 100%; max-width: 620px; max-height: 92%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px }
.sheet header { display: flex; justify-content: space-between; align-items: center; gap: 10px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px) }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px }
.ph { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 0; overflow: hidden; display: flex; flex-direction: column; text-align: left }
.ph img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--sunk); display: block }
.ph span { font-size: 13px; padding: 8px 10px; overflow-wrap: anywhere }
.big { width: 100%; max-width: 100%; border-radius: var(--r); background: var(--sunk); min-height: 120px }
.receipt { width: 100%; max-height: 260px; object-fit: contain; border-radius: 9px; background: var(--sunk) }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out } @keyframes up { from { transform: translateY(24px); opacity: .6 } } }
#rq, #ronly { font-size: 16px; color: var(--fg); background: var(--sunk); border: 0; border-radius: 999px; padding: 0 16px; height: 44px; width: 100%; -webkit-appearance: none; appearance: none }
html { padding-top: env(safe-area-inset-top, 0px) }
body { margin: 0 }
</style>
</head>

const LISTS = ["odometer", "services", "fuel", "mods", "papers", "wear", "checklists", "restoration", "shopping", "photos", "intervals"];

    if (NUMERIC.has(k) && !(depth === 0 && LISTS.includes(k))) {   // a bike's "odometer" is its list of readings
      // A number field holds a number, or a digit string that becomes one; anything else is dropped.
      const n = typeof v === "number" ? v : typeof v === "string" ? Number(v) : NaN;
      if (v == null) continue; else if (Number.isFinite(n)) x[k] = n; else delete x[k];
    }
    else if (DATES.has(k) && v != null && (typeof v !== "string" || isNaN(new Date(v)))) delete x[k];
    else if (typeof v === "number" && !Number.isFinite(v)) delete x[k];
    else if (k === "research" && depth === 0) { if (v && typeof v === "object" && !Array.isArray(v)) scrubLoose(v); else delete x[k] }

}
// Looked-up research is text from the web: it keeps its own field names (a spec "value" is text, not a
// number), so it only loses dangerous keys, broken numbers and wrong shapes. It is always shown escaped.
function scrubLoose(x, depth = 0) {
  if (depth > 8 || !x || typeof x !== "object") return;

    for (const k of ["facts", "items", "images", "sources", "imported", "generated"]) x[k] = x[k].filter(o => o && typeof o === "object" && !Array.isArray(o));
    x.excluded = x.excluded.filter(e => typeof e === "string");

function clean(f) {

    for (const k of LISTS) b[k] = Array.isArray(b[k]) ? b[k].filter(x => x && typeof x === "object" && !Array.isArray(x)).slice(-5000) : [];
    scrub(b);

    if (typeof del[i] === "string" && D(del[i + 1]) && !isNaN(D(del[i + 1]))) f.deleted.push(del[i], iso(Math.min(D(del[i + 1]).getTime(), cap)));

}
const SAFE_NAME = n => typeof n === "string" && n.length <= 128 && /^[A-Za-z0-9_-][A-Za-z0-9._-]*$/.test(n) && !n.includes("..");
function validFile(f) { return f && Array.isArray(f.bikes) && f.bikes.every(b => b && b.id && Array.isArray(b.odometer) && Array.isArray(b.services) && Array.isArray(b.intervals) && Array.isArray(b.fuel) && Array.isArray(b.papers)) }

// ---------- Rendering ----------
// What you type in the Log forms is kept as a draft (per bike, on this phone) until you save it, so a
// redraw, switching to another app, or the iPhone closing the page in the background never loses it.
const DRAFTS = "garagebook.drafts.v1", DRAFT_FORMS = ["odoForm", "fuelForm"];
const loadDrafts = () => { try { return JSON.parse(localStorage.getItem(DRAFTS) || "{}") || {} } catch { return {} } };
const saveDrafts = d => { try { localStorage.setItem(DRAFTS, JSON.stringify(d)) } catch {} };
function keepDraft(el) {
  const form = el.closest("form"); if (!form || !DRAFT_FORMS.includes(form.id) || !el.id || !S.bike) return;
  const d = loadDrafts(), mine = d[S.bike] ??= {}, f = mine[form.id] ??= {};
  f[el.id] = el.type === "checkbox" ? el.checked : el.value;
  saveDrafts(d);
}
function restoreDrafts() {
  const mine = loadDrafts()[S.bike] || {};
  for (const id of DRAFT_FORMS) for (const [field, v] of Object.entries(mine[id] || {})) {
    const el = document.getElementById(field);
    if (!el || el.closest("form")?.id !== id) continue;
    if (el.type === "checkbox") el.checked = !!v; else el.value = String(v);
  }
}
function clearDraft(formId) { const d = loadDrafts(); if (d[S.bike]) { delete d[S.bike][formId]; saveDrafts(d) } }
document.addEventListener("input", e => keepDraft(e.target));
document.addEventListener("change", e => keepDraft(e.target));

// Background syncs only redraw the page when the garage really changed, and never while you're typing

let redrawWaiting = false;
const typing = () => { const a = document.activeElement; return !!a && $("#view").contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) };
function renderQuietly() { if (typing()) { redrawWaiting = true; renderChip() } else render() }
document.addEventListener("focusout", () => setTimeout(() => { if (redrawWaiting && !typing()) { redrawWaiting = false; render() } }, 0));

function render() {
  redrawWaiting = false;
  const b = bike();
  S.bike = b?.id ?? null;
  $("#bike").innerHTML = bikes().map(x => `<option value="${esc(x.id)}"${x.id === S.bike ? " selected" : ""}>${esc(x.name)}</option>`).join("");
  renderView(b);
}
function renderChip() {
  const chip = $("#syncChip"), text = $("#syncText");
  chip.classList.toggle("dirty", !!S.dirty);
  chip.querySelector(".dot").style.background = !S.session ? "var(--muted)" : lastError ? "var(--over)" : S.dirty || syncing ? "var(--soon)" : "var(--ok)";
  text.textContent = !S.session ? "Sign in" : syncing ? "Syncing…" : lastError ? "Not synced" : S.dirty ? "Waiting to sync" : "Synced";
}
function renderView(b) {
  renderChip();
  document.querySelectorAll("#tabs button").forEach(t => t.setAttribute("aria-current", t.dataset.tab === S.tab ? "page" : "false"));
  const v = $("#view");
  if (!b) { v.innerHTML = `<section><div class="card"><h2>No bikes</h2><p class="muted">${S.session ? "Your online garage is empty. Sign in on the Mac app with the same account to upload your bikes, or add one here." : "Sign in to see your garage."}</p><div class="btns">${S.session ? '<button class="btn" data-act="newBike">Add bike</button>' : '<button class="btn" data-act="account">Sign in</button>'}</div></div></section>`; return }
  const banner = S.example ? `<section><div class="banner example"><span>This is an <b>example bike</b>. Sign in to see your own garage.</span><button class="linkbtn" data-act="account">Sign in</button></div></section>`

function jobRow(it) {

  const pct = it.progress == null ? null : Math.max(0, Math.min(1, it.progress));
  const cls = it.status === "overdue" ? "over" : it.status === "soon" ? "soon" : "";
  return `<div class="job${due ? " due" : ""}">
    ${due && !it.kind && !String(it.id).startsWith("wear-")
      ? `<button type="button" class="icon" data-done="${esc(it.id)}" aria-label="${esc(it.title)}: mark as done">${iconFor(it)}</button>`
      : `<div class="icon" aria-hidden="true">${iconFor(it)}</div>`}

    <div class="when">${it.status === "unknown" ? "No record" : esc(it.detail)}</div>
    ${pct != null ? `<div class="bar" role="progressbar" aria-valuenow="${Math.round(pct * 100)}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(it.title)}"><i class="${cls}" style="width:${(pct * 100).toFixed(1)}%"></i></div>` : `<div class="small muted" style="grid-column:2/4">${it.status === "unknown" ? "Log it once to start the countdown" : ""}</div>`}
  </div>`;
}

// The number shown big behind the bike's name: the engine size. A 125 shows 125, a 599 cc bike shows 600.
function engineSize(b) {
  const pick = (text, noYears) => (String(text || "").match(/\d{2,4}/g) || []).map(Number).find(n => n >= 50 && n <= 2500 && !(noYears && n >= 1900 && n <= 2099));
  const fromModel = pick(b.model);
  if (fromModel) return String(fromModel);
  const fact = (b.research?.facts || []).find(f => /^displacement$/i.test(f?.label || ""));
  const m = fact && String(fact.value ?? "").match(/(\d{2,4}(?:\.\d+)?)\s*(?:cc|cm)/i);
  if (m) { const n = Math.round(+m[1]), r = Math.round(n / 50) * 50; return String(Math.abs(r - n) <= 5 ? r : n) }
  const fromName = pick(b.name, true);
  return fromName ? String(fromName) : "";
}

function confirmDelete(btn, run) {
  let armed = false;
  btn.onclick = () => { if (armed) return run(); armed = true; btn.textContent = "Tap again to delete"; setTimeout(() => { armed = false; btn.textContent = btn.textContent.replace("Tap again to delete", "Delete") }, 3000) };
}

// Tapping the icon of a due job on the overview: confirm it's done, then log it with date, odometer, cost and shop.

    el.querySelector("#dnYes").onclick = () => openSheet(`${head(`Log: ${iv.task}`)}<form class="form" id="dnf">

function serviceSheet(b, existing) {

  const all = [...new Set([...b.intervals.map(i => i.task), ...s.tasks])];
  let dateJobs = false;
  const steps = milestones(b, s.odometer ?? mileage(b));
  const near = steps.length ? steps.reduce((m, x) => Math.abs(x - (s.odometer ?? 0)) < Math.abs(m - (s.odometer ?? 0)) ? x : m) : null;
  const dueByDate = b.intervals.filter(iv => !iv.everyDistance && hasTime(iv)).map(iv => status(b, iv)).filter(d => d.status === "overdue" || d.status === "soon" || d.status === "unknown").map(d => d.title);

      <button class="btn ghost" type="button" id="tick"></button>
      <p class="small muted" style="margin:0">Ticks every job due at this mileage. Untick anything you're skipping below.</p></div>` : ""}
    <div class="f small muted">Jobs done</div><div class="tasks" id="tl"></div>
    <div class="fields2"><label class="f">Other job<input id="cj" placeholder="e.g. New grips"></label><div style="display:flex;align-items:flex-end"><button class="btn ghost" type="button" id="addj" style="width:100%">Add job</button></div></div>
    <div class="fields2"><label class="f">Shop<input id="sh" value="${esc(s.shop)}"></label><label class="f">Cost<input id="sc" inputmode="decimal" value="${esc(s.cost || "")}"></label></div>
    <label class="f">Notes<textarea id="sn" rows="2">${esc(s.notes)}</textarea></label>
    <div class="form" id="rc">${s.receipt ? `<img class="receipt" data-photo="${esc(s.receipt)}" alt="Receipt">` : ""}${S.session ? `<button class="btn ghost" type="button" id="addr">${s.receipt ? "Replace receipt photo" : "Add receipt photo"}</button>` : ""}</div>
    <button class="btn">${existing ? "Save" : "Save service"}</button>${existing ? '<button class="btn danger" type="button" id="sdel">Delete service</button>' : ""}</form>`, el => {
    const tl = el.querySelector("#tl"), tick = el.querySelector("#tick");
    loadPhotos(el);
    el.querySelector("#addr")?.addEventListener("click", async () => {
      const file = await pickPhoto(); if (!file) return;
      const btn = el.querySelector("#addr"); btn.disabled = true; btn.textContent = "Uploading…";
      try { s.receipt = await uploadPhoto(file); el.querySelector("#rc").querySelector("img")?.remove();
        btn.insertAdjacentHTML("beforebegin", `<img class="receipt" data-photo="${esc(s.receipt)}" alt="Receipt">`); loadPhotos(el); btn.textContent = "Replace receipt photo" }
      catch (err) { btn.textContent = err.message || "Upload failed" }
      btn.disabled = false;
    });
    const ivFor = t => b.intervals.find(i => i.task === t);
    const drawTasks = () => {
      tl.innerHTML = all.map(t => { const iv = ivFor(t), on = s.tasks.some(x => x.toLowerCase() === t.toLowerCase());
        const every = iv ? [iv.everyDistance ? `${fmtNum(iv.everyDistance)} ${esc(b.unit)}` : "", iv.everyWeeks > 0 ? `${esc(iv.everyWeeks)} wk` : iv.everyMonths ? `${esc(iv.everyMonths)} mo` : ""].filter(Boolean).join(" · ") : "extra";
        return `<button type="button" class="task${on ? " on" : ""}" data-t="${esc(t)}" aria-pressed="${on}"><span class="box">${on ? "✓" : ""}</span><span>${esc(t)}</span><span class="every">${every}</span></button>` }).join("");
    };
    const picked = () => { const m = +el.querySelector("#ms").value; return [...jobsAt(b, m), ...(dateJobs ? dueByDate : [])] };
    const drawTick = () => { if (tick) { const n = picked().length; tick.textContent = `Tick the ${n} jobs for this service`; tick.disabled = !n } };
    drawTasks(); drawTick();
    tl.onclick = e => { const t = e.target.closest(".task")?.dataset.t; if (!t) return; const i = s.tasks.findIndex(x => x.toLowerCase() === t.toLowerCase()); i >= 0 ? s.tasks.splice(i, 1) : s.tasks.push(t); drawTasks() };
    el.querySelector("#ms")?.addEventListener("change", drawTick);
    el.querySelector("#dj")?.addEventListener("change", e => { dateJobs = e.target.checked; drawTick() });
    tick?.addEventListener("click", () => {
      const p = picked(), sched = b.intervals.map(i => i.task.toLowerCase());
      const custom = s.tasks.filter(t => !sched.includes(t.toLowerCase()));
      s.tasks = [...p, ...custom.filter(t => !p.includes(t))];
      if (!el.querySelector("#so").value) el.querySelector("#so").value = el.querySelector("#ms").value;
      drawTasks(); toast(`${p.length} jobs ticked`);
    });
    el.querySelector("#addj").onclick = () => { const v = el.querySelector("#cj").value.trim(); if (!v) return; if (!all.includes(v)) all.push(v); if (!s.tasks.includes(v)) s.tasks.push(v); el.querySelector("#cj").value = ""; drawTasks() };
    el.querySelector("#sv").onsubmit = e => {
      e.preventDefault();
      s.date = iso(fromDateInput(el.querySelector("#sd").value, s.date));
      const o = num(el.querySelector("#so").value); if (o == null) delete s.odometer; else s.odometer = o;
      s.shop = el.querySelector("#sh").value.trim(); s.cost = num(el.querySelector("#sc").value) || 0; s.notes = el.querySelector("#sn").value;
      if (existing) Object.keys(existing).forEach(k => delete existing[k]), Object.assign(existing, s); else b.services.push(s);
      closeSheet(); changed(b); toast(existing ? "Service updated" : "Service logged");
    };
    const del = el.querySelector("#sdel"); if (del) confirmDelete(del, () => { b.services = b.services.filter(x => x.id !== existing.id); closeSheet(); changed(b); toast("Service deleted") });
  });
}

// ---------- Schematics: everything the "lookup" server function found about the bike ----------
// Sorting happens on the server with keyword lists; searching happens here with fuzzy word matching,
// synonyms and rare-word weighting. No AI model is involved.
const R_SECTIONS = [["overview", "Specs"], ["engine", "Engine"], ["chassis", "Chassis, brakes, tyres"], ["dimensions", "Dimensions and weights"],
  ["electrics", "Electrics"], ["schematics", "Schematics and images"], ["mods", "Mods and upgrades"], ["issues", "Known problems"], ["recalls", "Recalls"],
  ["manuals", "Manuals"], ["history", "History and generations"], ["links", "Links"]];
const rTitle = id => (R_SECTIONS.find(s => s[0] === id) || [id, id])[1];
const SYN = (() => {
  const groups = [["tyre", "tire", "tyres", "tires", "wheel"], ["oil", "lubrication", "sump"], ["weight", "mass", "kg", "heavy"], ["power", "hp", "kw", "horsepower", "bhp"],
    ["torque", "nm"], ["tank", "fuel", "petrol", "gas"], ["brake", "brakes", "disc", "caliper", "abs"], ["plug", "spark"], ["chain", "sprocket", "drive"], ["speed", "fast", "kmh"],
    ["schematic", "schematics", "diagram", "exploded", "drawing", "wiring", "fiche"], ["mod", "mods", "upgrade", "upgrades", "tuning", "accessory", "accessories"],
    ["problem", "problems", "issue", "issues", "fault", "faults", "failure"], ["light", "lights", "lamp", "headlight", "indicator", "led"], ["battery", "charging", "stator", "regulator"],
    ["fuse", "fuses"], ["seat", "height"], ["manual", "manuals", "handbook"], ["recall", "recalls", "terugroep"], ["engine", "motor"], ["suspension", "fork", "shock"],
    ["exhaust", "pipe", "muffler", "silencer"], ["cc", "displacement", "capacity"], ["gear", "gears", "gearbox", "transmission"]];
  const m = {}; for (const g of groups) for (const w of g) (m[w] ??= new Set(), g.forEach(x => x !== w && m[w].add(x))); return m;
})();
const R_STOP = new Set(["the", "a", "an", "of", "for", "my", "what", "is", "how", "much", "and", "on", "in", "to", "does", "do", "it", "bike", "which"]);
const rTokens = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").split(/[^a-z0-9.]+/).map(w => w.replace(/^\.+|\.+$/g, "")).filter(Boolean);
function editDistance(a, b, limit) {
  if (!a.length || !b.length) return Math.max(a.length, b.length);
  if (Math.abs(a.length - b.length) > limit) return limit + 1;
  // Optimal string alignment: a swap of two neighbouring letters ("widht") counts as one edit.
  let prev2 = null, prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (prev2 && i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) cur[j] = Math.min(cur[j], prev2[j - 2] + 1);
      best = Math.min(best, cur[j]);
    }
    if (best > limit) return limit + 1;
    prev2 = prev; prev = cur;
  }
  return prev[b.length];
}
function wordMatch(q, w) {
  if (q === w) return 1;
  if (q.length >= 2 && w.startsWith(q)) return 0.8;
  if (SYN[q]?.has(w)) return 0.7;
  if (q.length >= 4 && !/^\d+$/.test(q)) { const l = q.length >= 8 ? 2 : 1; if (editDistance(q, w, l) <= l) return 0.6 }
  return 0;
}
function smartSearch(query, docs, limit = 60) {
  const terms = rTokens(query).filter(t => !R_STOP.has(t));
  if (!terms.length) return [];
  const prep = docs.map(d => [d, rTokens(d.title), rTokens(d.body), rTokens(rTitle(d.section))]);
  const df = {}; for (const [, t, b] of prep) for (const w of new Set([...t, ...b])) df[w] = (df[w] || 0) + 1;
  const n = Math.max(docs.length, 1), hits = [];
  for (const [d, t, b, s] of prep) {
    let total = 0, matched = 0;
    for (const q of terms) {
      let best = 0;
      for (const [words, weight] of [[t, 3], [s, 1.5], [b, 1]]) for (const w of words) { const m = wordMatch(q, w); if (m) best = Math.max(best, m * weight * Math.log(1 + n / (df[w] || 1))) }
      if (best) { matched++; total += best }
    }
    if (!matched) continue;
    const full = matched === terms.length;
    hits.push({ doc: d, full, score: total * (full ? 1 : matched / terms.length * 0.5) });
  }
  const anyFull = hits.some(h => h.full);
  return hits.filter(h => !anyFull || h.full).sort((a, b) => b.score - a.score).slice(0, limit);
}
const factValues = f => Array.isArray(f.values) && f.values.length ? f.values : [{ value: f.value, sources: [{ source: f.source, url: f.url }] }];
const factKey = f => String(f.label || "").toLowerCase();
// Your pick, while it's still one of the values (a refresh can drop it, e.g. when the owner's manual overrules a website).
const shownValue = (r, f) => { const p = r.picked && r.picked[factKey(f)]; return typeof p === "string" && factValues(f).some(v => v.value === p) ? p : f.value; };
// Technical diagrams only: older lookups also saved photos of bikes, which are never shown.
const rDiagrams = r => (r.images || []).filter(im => im && im.kind !== "photo");
// Diagrams Garagebook drew from the specs. Shown as images (an <img> never runs scripts), and only plain drawings are accepted.
const SVG_BAD = /<script|<foreignObject|\bon[a-z]+\s*=|javascript:|href\s*=\s*"(?!#)|@import|url\((?!#)/i;
const rGenerated = r => (r.generated || []).filter(d => d && typeof d.svg === "string" && d.svg.startsWith("<svg") && d.svg.length < 200000 && !SVG_BAD.test(d.svg));
const genHtml = d => `<div class="ritem"><div class="rtitle">${esc(d.title)} <span class="rtag" style="background:#0d9488">GENERATED</span></div>
  <img class="rgen" alt="${esc(d.title)}" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(d.svg)}">
  ${Array.isArray(d.basis) && d.basis.length ? `<div class="small muted">Drawn by Garagebook from: ${esc(d.basis.join(", "))}. Uses your picks (as of the last Refresh).</div>` : ""}</div>`;
const safeHref = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null } catch { return null } };
let rQuery = "", rOnly = "all", rBusy = false, rMsg = "";

function researchDocs(r) {
  return [
    ...(r.facts || []).map((f, i) => ({ id: "f" + i, title: f.label, body: factValues(f).map(v => v.value).join(" ") + " " + f.source, section: f.section, html: () => factHtml(r, f, i, true) })),
    ...(r.items || []).map((it, i) => ({ id: "i" + i, title: it.title, body: [it.text, it.group, it.source].filter(Boolean).join(" "), section: it.section, html: () => itemHtml(it, i, true) })),
    ...rGenerated(r).map((d, i) => ({ id: "g" + i, title: d.title, body: "generated diagram drawing schematic " + (d.basis || []).join(" "), section: "schematics", html: () => genHtml(d) })),
    ...rDiagrams(r).map((im, i) => ({ id: "p" + i, title: im.title, body: `${im.kind} diagram drawing image ${im.license}`, section: "schematics", image: im })),
  ];
}
function ownDocs(b) {
  const out = [], add = (title, body, place) => out.push({ title, body, section: place, place });
  for (const s of b.services) add((s.tasks || []).join(", ") || "Service", `${s.shop || ""} ${s.notes || ""} ${fmtDate(s.date)}`, "Service log");
  for (const m of b.mods) add(m.title || "Mod", `${m.category || ""} ${m.brand || ""} ${m.partNumber || ""} ${m.notes || ""}`, "Mods and upgrades");
  for (const p of b.papers) add(p.kind || "Paper", `${p.provider || ""} ${p.number || ""} ${p.notes || ""}`, "Papers");
  for (const s of b.shopping) add(s.name || "Part", `${s.partNumber || ""} ${s.store || ""}`, "Budget and parts list");
  for (const c of b.checklists) for (const i of (c.items || [])) add(i.text || "", c.title || "", "Checklist");
  for (const r of b.restoration) add(r.title || "", `${r.phase || ""} ${r.notes || ""}`, "Restoration");
  for (const i of b.intervals) add(i.task || "", "interval schedule service", "Service schedule");
  for (const p of b.photos) if (p.caption) add(p.caption, p.kind || "", "Photos");
  if (b.story) add("Notes", b.story, "Bike notes");
  return out;
}

function factHtml(r, f, i, showSection) {
  const vals = factValues(f), shown = shownValue(r, f);
  const tag = f.official === true ? ' <span class="rtag" style="background:#16a34a" title="From the official owner\'s manual. Websites that disagree are left out.">MANUAL</span>' : "";
  const head = `<div class="row" style="align-items:baseline"><span class="muted">${esc(f.label)}</span><span style="text-align:right">${esc(shown)}${tag}</span></div>`;
  if (vals.length < 2) return `<div class="rfact">${head}<div class="small muted">${showSection ? esc(rTitle(f.section)) + " · " : ""}${esc(f.source)}</div></div>`;
  return `<div class="rfact">${head}<div class="small" style="color:var(--soon);margin:4px 0">Sources disagree. Tap the one you trust:</div>
    ${vals.map((v, j) => `<button type="button" class="rpick${shown === v.value ? " on" : ""}" data-pick="${i}" data-val="${j}"><b>${esc(v.value)}</b><span class="small muted">${esc((v.sources || []).map(s => s.source).join(", "))}</span></button>`).join("")}
    ${r.picked?.[factKey(f)] != null ? '<div class="small muted">Your pick is saved. Tap it again to go back to the most common value.</div>' : ""}</div>`;

  openSheet(`${head(p.caption || p.kind)}<img data-photo="${esc(p.filename)}" alt="" class="big">
    <form class="form" id="phf"><label class="f">Caption<input id="pc" value="${esc(p.caption)}"></label>
    <label class="f">Kind<select id="pk">${PHOTO_KINDS.map(k => `<option${k === p.kind ? " selected" : ""}>${k}</option>`).join("")}</select></label>
    <button class="btn">Save</button><button class="btn danger" type="button" id="pdel">Delete photo</button></form>`, el => {
    loadPhotos(el);
    el.querySelector("#phf").onsubmit = e => { e.preventDefault(); p.caption = el.querySelector("#pc").value.trim(); p.kind = el.querySelector("#pk").value; closeSheet(); changed(b) };
    confirmDelete(el.querySelector("#pdel"), async () => {
      b.photos = b.photos.filter(x => x.id !== p.id); closeSheet(); changed(b); toast("Photo deleted");
      try { await api(`storage/v1/object/garage/${S.session.id}/${encodeURIComponent(p.filename)}`, { method: "DELETE", token: await freshToken() }) } catch {}
    });
  });
}
async function addPhoto(b) {
  const file = await pickPhoto(); if (!file) return;
  toast("Uploading…");
  try { const name = await uploadPhoto(file); b.photos.push({ id: uuid(), filename: name, caption: "", date: iso(new Date()), kind: "General" }); changed(b); toast("Photo added") }
  catch (err) { toast(err.message || "Upload failed") }
}

// ---------- Account ----------
function accountSheet() {
  if (!cloudReady) { openSheet(`${head("Online sync")}<p class="muted">Online sync isn't set up yet.</p>`); return }
  if (S.session) {
    const when = S.lastSync ? `Last synced ${new Date(S.lastSync).toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit" })}.` : "Not synced yet.";
    openSheet(`${head("Online sync")}<div class="card form"><div class="t">Signed in with your passkey</div>
      <p class="small muted" style="margin:0">${when}${lastError ? ` <span style="color:var(--over)">${esc(lastError)}</span>` : ""} Changes upload a moment after you make them, and this page checks for changes from your Mac every 15 seconds while it's open.</p>
      <button class="btn" data-act="sync" type="button">Sync now</button><button class="btn ghost" data-act="newBike" type="button">Add bike</button>
      <button class="btn ghost" data-act="addPasskey" type="button">Add another passkey</button><button class="btn ghost" data-act="signout" type="button">Sign out</button>
      <button class="btn danger" data-act="signoutAll" type="button">Sign out on every device</button>
      <p class="small muted" style="margin:0">Lost a phone or laptop? "Sign out on every device" ends Garagebook's sign-in everywhere, including the Mac app. Sign in again with your passkey afterwards.</p></div>`);
    return;
  }
  openSheet(`${head("Sign in")}<div class="card form">
    <p class="muted" style="margin:0">Garagebook signs in with a passkey. It's saved in iCloud Keychain, so the same one works on your iPhone and Mac. No password.</p>
    <button class="btn" type="button" id="pkIn">Sign in with passkey</button>
    <button class="btn ghost" type="button" id="pkNew">Create passkey (first time)</button>
    <p class="small muted" id="aNote" style="margin:0"></p></div>`, el => {
    const note = el.querySelector("#aNote"), btns = el.querySelectorAll("button.btn");
    const go = async (work, label) => {
      btns.forEach(b => b.disabled = true); note.textContent = label;
      try { keepSession(await work()); await firstSync(); closeSheet(); toast("Signed in") } catch (err) { note.textContent = passkeyMessage(err) }
      btns.forEach(b => b.disabled = false);
    };
    el.querySelector("#pkIn").onclick = () => go(passkeySignIn, "Waiting for your passkey…");
    el.querySelector("#pkNew").onclick = () => go(passkeyCreate, "Creating your passkey…");
  });
}
async function addPasskey() {
  try { await passkeyCreate(); toast("Passkey added") } catch (err) { toast(passkeyMessage(err)) }
}
function appLoginScreen() {
  document.querySelector(".top").hidden = true; $("#tabs").hidden = true;
  $("#view").innerHTML = `<section style="margin-top:12vh"><div class="card form"><h2>Sign in the Mac app</h2>
    <p class="muted" style="margin:0">This gives the Garagebook app on this Mac access to your online garage. Only continue if you just pressed <b>Sign in with passkey</b> in Garagebook on your Mac.</p>
    <button class="btn" type="button" id="macIn">Sign in with passkey</button><p class="small muted" id="macNote" style="margin:0"></p></div></section>`;
  $("#macIn").onclick = async () => {
    const note = $("#macNote"); note.textContent = "Waiting for your passkey…";
    try { handBack(await passkeySignIn(appLogin.cc)); note.textContent = "Signed in. Going back to the Mac app…" } catch (err) { note.textContent = passkeyMessage(err) }
  };
}

function bikeSheet() {
  openSheet(`${head("Add bike")}<form class="form" id="bk">
    <label class="f">Name<input id="bn" required placeholder="e.g. Yamaha MT-07"></label>
    <div class="fields2"><label class="f">Year<input id="by" inputmode="numeric"></label><label class="f">Distance<select id="bu"><option>km</option><option>mi</option></select></label></div>
    <div class="fields2"><label class="f">Bought on<input id="bd" type="date"></label><label class="f">Price<input id="bp" inputmode="decimal"></label></div>
    <button class="btn">Add bike</button><p class="small muted" style="margin:0">It starts with a basic schedule. Import the booklet in the Mac app for the full one.</p></form>`, el => {
    el.querySelector("#bk").onsubmit = e => {
      e.preventDefault(); const km = el.querySelector("#bu").value === "km", k = v => km ? v : Math.round(v / 1.609344 / 500) * 500;
      const iv = (task, d, m) => ({ id: uuid(), task, ...(d ? { everyDistance: k(d) } : {}), ...(m ? { everyMonths: m } : {}) });
      const yr = parseInt(el.querySelector("#by").value), bd = el.querySelector("#bd").value, bp = num(el.querySelector("#bp").value);
      const b = { id: uuid(), updatedAt: iso(new Date()), name: el.querySelector("#bn").value.trim(), make: "", model: "", vin: "", plate: "", unit: km ? "km" : "mi", story: "",
        ...(yr ? { year: yr } : {}), ...(bd ? { purchaseDate: iso(fromDateInput(bd)) } : {}), ...(bp != null ? { purchasePrice: bp } : {}),
        odometer: [], services: [], fuel: [], mods: [], papers: [], wear: [], checklists: [], restoration: [], shopping: [], photos: [],
        intervals: [iv("Oil and filter", 5000, 12), iv("Chain clean and lube", 1000, 1), iv("Air filter", 10000, 24), iv("Spark plugs", 13000, 24), iv("Brake fluid", null, 24), iv("Coolant", null, 24), iv("Valve clearance check", 24000, null)] };
      S.file.bikes.push(b); S.bike = b.id; closeSheet(); changed(b); toast("Bike added");
    };
  });
}

// ---------- Events ----------
$("#bike").addEventListener("change", e => { S.bike = e.target.value; persist(); render() });
$("#syncChip").addEventListener("click", accountSheet);
$("#tabs").addEventListener("click", e => { const t = e.target.closest("button")?.dataset.tab; if (t) { S.tab = t; persist(); render(); scrollTo(0, 0) } });
document.addEventListener("click", e => {
  const b = bike(), a = e.target.closest("[data-act]")?.dataset.act, go = e.target.closest("[data-go]")?.dataset.go;
  if (go) { S.tab = go; persist(); render(); scrollTo(0, 0); return }
  if (a === "account") return accountSheet();
  if (a === "sync") return sync();
  if (a === "signout") return signOut();
  if (a === "signoutAll") { if (confirm("Sign out of Garagebook on every device, including the Mac app?")) return signOut(true); return }
  if (a === "newBike") return bikeSheet();
  if (a === "addPhoto") return addPhoto(b);
  if (a === "addPasskey") return addPasskey();
  const dn = e.target.closest("[data-done]")?.dataset.done; if (dn) return doneSheet(b, b.intervals.find(i => i.id === dn));
  const ph = e.target.closest("[data-photo-id]")?.dataset.photoId; if (ph) return photoSheet(b, b.photos.find(x => x.id === ph));
  if (a === "newService") return serviceSheet(b);
  if (a === "newPaper") return paperSheet(b);
  const o = e.target.closest("[data-edit-odo]")?.dataset.editOdo; if (o) return odoSheet(b, b.odometer.find(r => r.id === o));
  const f = e.target.closest("[data-edit-fuel]")?.dataset.editFuel; if (f) return fuelSheet(b, b.fuel.find(r => r.id === f));
  const s = e.target.closest("[data-edit-service]")?.dataset.editService; if (s) return serviceSheet(b, b.services.find(r => r.id === s));
  const p = e.target.closest("[data-edit-paper]")?.dataset.editPaper; if (p) return paperSheet(b, b.papers.find(r => r.id === p));
});
document.addEventListener("submit", e => {
  const b = bike();
  if (e.target.id === "odoForm") { e.preventDefault(); const v = num($("#odoVal").value); if (v == null) return; clearDraft("odoForm");
    b.odometer.push({ id: uuid(), date: iso(fromDateInput($("#odoDate").value)), value: v }); changed(b); toast(`Saved ${fmtNum(v)} ${esc(b.unit)}`) }
  if (e.target.id === "fuelForm") { e.preventDefault(); const a = num($("#fOdo").value), v = num($("#fVol").value), t = num($("#fTot").value); if ([a, v, t].includes(null)) return;
    clearDraft("fuelForm"); b.fuel.push({ id: uuid(), date: iso(fromDateInput($("#fDate").value)), odometer: a, volume: v, total: t, full: $("#fFull").checked }); changed(b); toast("Fill saved") }
});
if (appLogin) appLoginScreen(); else { render(); sync() }
</script>
</body>
</html>
