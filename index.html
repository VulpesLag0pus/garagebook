<style>
/* Layout: one narrow column, a big bike card up top, a floating menu bar at the bottom for one-handed use.
   One accent colour (--accent, the dark blue). --tint is a light version of it. Green, orange and red only mark status.
   The page is always light, also when the phone is in dark mode. */
:root {
  --bg: #F3F4F7; --surface: #ffffff; --sunk: #ECEEF5; --fg: #0F1736; --muted: #4B5375; --line: #E1E4EE;
  --accent: #0F1736; --accent-fg: #ffffff; --tint: #DFE3F2; --nav: #0F1736; --ok: #1F7A4D; --soon: #B25E00; --over: #B42318;
  --display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  --r: 20px; color-scheme: light;
}

* { box-sizing: border-box }
html, body { background: var(--bg); color: var(--fg) }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100% }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 620px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(104px + env(safe-area-inset-bottom, 0px)) }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -.02em; margin: 0; text-wrap: balance }
h2 { font-size: 22px }
h3 { font-size: 18px }
.num { font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.small { font-size: 13px }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: 12px 10px }
.top select { flex: 1; min-width: 0; font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -.02em; background: none; border: 0; padding: 0; appearance: none; -webkit-appearance: none; text-overflow: ellipsis }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; border: 0; min-height: 36px; background: var(--surface); white-space: nowrap }
.chip .dot { width: 8px; height: 8px; border-radius: 50% }
.chip.dirty { color: var(--soon) }
.banner { border-radius: var(--r); padding: 12px 14px; background: var(--sunk); font-size: 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap }
.banner.example { border: 1px dashed var(--muted) }

/* Sections */
section { display: flex; flex-direction: column; gap: 12px; margin-top: 18px }
.card { background: var(--surface); border-radius: var(--r); padding: 16px 18px }

/* Bike card: the engine size in big light digits behind the name, then the bike, then the two main buttons */
.hero { position: relative; overflow: hidden; border-radius: 24px; padding: 20px 18px; display: flex; flex-direction: column; gap: 12px }
.hero > * { position: relative }
.hero .heronum { position: absolute; right: -10px; top: -22px; font: 700 clamp(120px, 44vw, 190px)/1 var(--display); color: var(--tint); letter-spacing: -.05em; pointer-events: none; user-select: none }
.hero .heronum.n4 { font-size: clamp(92px, 33vw, 150px); top: -14px }
.hero h1 { font-size: clamp(38px, 13vw, 56px); line-height: .92; letter-spacing: -.03em; overflow-wrap: anywhere }
.tags { display: flex; gap: 6px; flex-wrap: wrap }
.tag { background: var(--sunk); font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 999px }
.tag.on { background: var(--accent); color: var(--accent-fg) }
.bikeart { display: block; width: 100%; height: auto; color: var(--accent) }
.hero .btn { width: 100% }
.stat.dark { background: var(--accent); color: var(--accent-fg) }
.stat.dark .label, .stat.dark .sub { color: color-mix(in srgb, var(--accent-fg) 72%, transparent) }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.stat .label { font-size: 12px; color: var(--muted) }
.stat .value { font-family: var(--display); font-size: 28px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1 }
.stat .sub { font-size: 12px; color: var(--muted) }

/* Odometer gauge */
.odo { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px }
.odo .digits { display: flex; gap: 3px }
.odo .digits span { font-family: var(--display); font-weight: 600; font-size: 40px; line-height: 1; background: var(--fg); color: var(--bg); border-radius: 5px; padding: 6px 4px 4px; min-width: 28px; text-align: center; font-variant-numeric: tabular-nums }
.odo .unit { font-family: var(--display); font-size: 20px; color: var(--muted) }

/* Job rows */
.jobs { display: flex; flex-direction: column }
.job { display: grid; grid-template-columns: 32px 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line) }
.job:first-child { border-top: 0 }
.job .icon { grid-row: span 2; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--sunk); color: var(--muted) }
.job.due .icon { background: color-mix(in srgb, var(--soon) 18%, transparent); color: var(--soon) }
.job .icon svg { width: 18px; height: 18px }
.job button.icon { border: 0; padding: 0; cursor: pointer; font: inherit }
.job button.icon:active { transform: scale(.92) }
.job .name { font-weight: 500; min-width: 0 }
.job .when { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap }
.bar { grid-column: 2 / 4; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--ok) }
.bar i.soon { background: var(--soon) } .bar i.over { background: var(--over) }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 8px; white-space: nowrap }
.pill.over { background: color-mix(in srgb, var(--over) 16%, transparent); color: var(--over) }
.pill.soon { background: color-mix(in srgb, var(--soon) 18%, transparent); color: var(--soon) }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok) }

/* Lists and forms */
.rows { display: flex; flex-direction: column }
[hidden] { display: none !important }
/* On a computer (window 1000 px or wider): the Mac app's look. A light sidebar with the bike and its pages, wide content. */
.side { display: none }
body.desk .wrap { max-width: 1240px; display: grid; grid-template-columns: 250px minmax(0, 1fr); column-gap: 32px; padding: 0 28px 40px }
body.desk .side { grid-row: 1 / span 2; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 18px 0 }
body.desk .top { grid-column: 2; justify-content: flex-end }
body.desk .top select { display: none }
body.desk #view { grid-column: 2; max-width: 980px }
body.desk #tabs { display: none }
body.desk .bikeart { max-height: 240px; width: auto; max-width: 100%; align-self: center }
body.desk .hero { max-width: 980px }
body.desk .dashhead { display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap }
body.desk .dashhead .btns { margin: 0; flex-wrap: nowrap; align-items: center }
body.desk .dashhead .btns .btn { flex: none; white-space: nowrap }
.dash { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
.dash .widget { display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.dash .widget.dark { background: var(--accent); color: var(--accent-fg) }
.dash .widget.dark .label, .dash .widget.dark .sub, .dash .widget.dark .muted { color: color-mix(in srgb, var(--accent-fg) 72%, transparent) }
.dash .widget.dark .linkbtn { color: var(--accent-fg) }
.dash.arranging .widget { outline: 2px dashed var(--line); cursor: grab }
.dash .wctl { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 6px }
.dash .wctl .linkbtn { margin-left: 8px }
.dash .chart { width: 100%; height: auto }
.dash .chart .ax { font-size: 13px; fill: var(--muted) }
.dash textarea { width: 100%; min-height: 90px; resize: vertical }
#wAdd { min-width: 180px }
.side .sw { display: flex; flex-direction: column; gap: 2px; background: var(--surface); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px }
.side .sw select { font-family: var(--display); font-size: 17px; font-weight: 700; border: 0; background: none; padding: 0 }
.side .it { display: flex; align-items: center; gap: 10px; border: 0; background: none; color: var(--muted); font-weight: 600; font-size: 14px; padding: 8px 12px; border-radius: 999px; text-align: left; min-height: 36px }
.side .it svg { width: 18px; height: 18px; flex: none }
.side .it:hover { background: var(--sunk) }
.side .it[aria-current="page"] { background: var(--accent); color: var(--accent-fg) }
.side hr { border: 0; border-top: 1px solid var(--line); margin: 8px 4px; width: auto }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-items: start }
label.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px }
label.check input { margin-top: 3px }
label.check > span { flex: 1 }
.addrow { display: flex; gap: 8px; align-items: center }
.addrow input { flex: 1; min-width: 0 }
.pill { border: 0; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; background: var(--sunk); color: var(--muted) }
.pill.on { background: var(--accent); color: var(--accent-fg) }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px }
.pcard { display: flex; flex-direction: column; gap: 6px }
.pcard img, .pcard .noimg { width: 100%; height: 160px; object-fit: contain; background: #fff; border-radius: 12px; border: 1px solid var(--line) }
.pcard .noimg { display: grid; place-items: center }
a.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center }
#print { display: none }
#print table { width: 100%; border-collapse: collapse; margin-bottom: 14px } #print td { border-bottom: 1px solid #ddd; padding: 4px 6px; font-size: 12px }
@media print { body > *:not(#print) { display: none !important } #print { display: block } }

.row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center }
.row:first-child { border-top: 0 }
.row > div { min-width: 0 }
.row .t { font-weight: 500; overflow-wrap: anywhere }
.row.tap { cursor: pointer }
.row .warn { color: var(--soon); font-size: 12px }
form, .form { display: flex; flex-direction: column; gap: 10px }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted) }
label.f input, label.f select, label.f textarea { font-size: 16px; color: var(--fg); background: var(--sunk); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; width: 100%; min-width: 0 }
.fields2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px }
.fields2 > * { min-width: 0 }
/* iPhone Safari gives date fields their own minimum width, height and centred text; make them match the others. */
label.f input, label.f select { height: 44px; line-height: 22px }
label.f input[type="date"] { -webkit-appearance: none; appearance: none; display: block; max-width: 100%; text-align: left }
label.f input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0 }
label.f input[type="date"]::-webkit-calendar-picker-indicator { margin: 0 }
.check { display: flex; gap: 10px; align-items: center; font-size: 15px; color: var(--fg) }
.check input { width: 20px; height: 20px; accent-color: var(--accent) }
.btn { border: 0; border-radius: 999px; min-height: 48px; padding: 12px 20px; font-weight: 700; background: var(--accent); color: var(--accent-fg) }
.btn.ghost { background: var(--sunk); color: var(--fg) }
.btn.danger { background: none; color: var(--over); padding-inline: 0; min-height: 0 }
.btn:disabled { opacity: .45 }
.btns { display: flex; gap: 10px; flex-wrap: wrap }
.btns .btn { flex: 1 }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600 }

/* Task picker */
.tasks { display: flex; flex-direction: column; max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 9px; background: var(--sunk) }
.task { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 15px; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100% }
.task:first-child { border-top: 0 }
.task .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--muted); flex: none; display: grid; place-items: center }
.task.on .box { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }
.task .every { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap }

/* Bottom tabs */
nav.tabs { position: fixed; z-index: 6; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); max-width: 600px; margin-inline: auto; background: var(--nav); border-radius: 26px; display: grid; grid-template-columns: repeat(6, 1fr); padding: 6px }
nav.tabs button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 600; color: rgba(255, 255, 255, .5); padding: 6px 0; min-height: 48px; justify-content: center }
nav.tabs button svg { width: 22px; height: 22px }
.rfact, .ritem { padding: 10px 0; border-bottom: 1px solid var(--line) }
.rfact:last-child, .ritem:last-child { border-bottom: 0 }
.rtitle { font-weight: 600; margin-bottom: 2px; overflow-wrap: anywhere }
.rtitle a { color: inherit }
.rtag { color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 99px; letter-spacing: .03em; vertical-align: middle }
.rpick { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left; background: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 4px 0; color: inherit; font: inherit }
.rpick.on { border-color: var(--accent); background: var(--sunk) }
.rgen { display: block; width: 100%; height: auto; border-radius: 8px; margin: 6px 0; background: #fff }
.rimgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding: 10px 0 }
.rimg { display: flex; flex-direction: column; gap: 3px; color: inherit; text-decoration: none; min-width: 0 }
.rimg img { width: 100%; height: 110px; object-fit: contain; background: var(--line); border-radius: 8px }
.rimg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.btn.small { padding: 6px 14px; font-size: 13px; margin-top: 6px; min-height: 36px }
nav.tabs button { min-width: 0; overflow: hidden; text-overflow: ellipsis }
nav.tabs button[aria-current="page"] { color: #fff }
nav.tabs button:focus-visible { outline-color: #fff; outline-offset: -2px; border-radius: 20px }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, #000 45%, transparent); display: flex; align-items: flex-end; justify-content: center }
.sheet { background: var(--bg); width: 100%; max-width: 620px; max-height: 92%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px }
.sheet header { display: flex; justify-content: space-between; align-items: center; gap: 10px }
.toast { position: fixed; left: 16px; right: 16px; width: fit-content; max-width: 588px; margin-inline: auto; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 18px; font-size: 14px; line-height: 1.4 }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px }
.ph { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 0; overflow: hidden; display: flex; flex-direction: column; text-align: left }
.ph img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--sunk); display: block }
.ph span { font-size: 13px; padding: 8px 10px; overflow-wrap: anywhere }
.big { width: 100%; max-width: 100%; border-radius: var(--r); background: var(--sunk); min-height: 120px }
.receipt { width: 100%; max-height: 260px; object-fit: contain; border-radius: 9px; background: var(--sunk) }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out } @keyframes up { from { transform: translateY(24px); opacity: .6 } } }
#rq, #ronly { font-size: 16px; color: var(--fg); background: var(--sunk); border: 0; border-radius: 999px; padding: 0 16px; height: 44px; width: 100%; -webkit-appearance: none; appearance: none }
html { padding-top: env(safe-area-inset-top, 0px) }
body { margin: 0 }
</style>
</head>

  if (c.filled.includes("total")) parts.push(`paid ${fmtMoney(c.fill.total)}`);
  if (!parts.length) return "";
  const priced = c.price && (c.filled.includes("volume") || c.filled.includes("total"));
  return `Estimated: ${parts.join(", ")}.${priced ? ` Price ${fmtPerVolume(c.price.value)} per ${vol}, ${priceSourceText(c.price)}.` : ""}`;
}
function fillMissing(c, b) {
  const m = c.missing, where = b && b.unit === "km" ? ` in ${placeName(c.fill.country)}` : "";
  if (m.includes("odometer")) return "Fill in the odometer: there are no readings yet to estimate it from.";
  if (m.includes("volume") && m.includes("total")) return "Fill in the amount or what you paid. The other one is estimated from fuel prices for that day.";
  if (m.includes("total")) return `Fill in what you paid: there are no fuel prices${where} to estimate it from yet.`;
  if (m.includes("volume")) return `Fill in the amount: there are no fuel prices${where} to estimate it from yet.`;
  return "";
}
// "Check my location" on the Log page.
async function useLocation() {
  toast("Checking where this phone is…", 20000);
  const where = await locate(20000);
  render();
  if (where === "near") toast(`This phone is within ${COUNTRY_UNSURE_KM} km of a border, too close to tell. Pick the country on the fill.`, 7000);
  else if (where) toast(`This phone is in ${placeName(where)}. New fills use that country.`, 6000);
  else toast("Couldn't get this phone's location. New fills use the country of its time zone; you can change it on each fill.", 7000);
}
// Saves a fuel fill from the Log form (fillId null) or the edit sheet. What is left empty is estimated first.
// That can take a moment (prices may have to be fetched), so the caller reads everything from the page
// before calling, and the bike is looked up again after waiting: a sync in between may have replaced it.
// `input`: { odo, vol, tot (numbers, or null when left empty), dateStr, full, country (a code, or null to use
// where this phone is), shown (the country the form showed) }.
let savingFill = false;
async function saveFill(bikeId, input, fillId) {
  if (savingFill) return null;
  savingFill = true;
  try {
    let b = bikes().find(x => x.id === bikeId); if (!b) return null;
    const needsPrice = input.vol == null || input.tot == null;
    // A new fill whose country you left alone: check where this phone is now (the browser asks you first).
    let country = input.country;
    if (!country) { if (b.unit === "km" && !locatedCountry()) await locate(); country = hereCountry() }
    const sources = needsPrice && b.unit === "km" ? await priceSources(country) : {};
    b = bikes().find(x => x.id === bikeId);
    const old = fillId ? b?.fuel.find(f => f.id === fillId) : null;
    if (!b || (fillId && !old)) { toast("That fill is no longer there."); return null }
    let date = input.dateStr ? fromDateInput(input.dateStr, old?.date) : null, dateNote = "";
    if (!date) { const d = input.odo != null ? dateAt(b, input.odo, fillId) : null; date = d ?? new Date(); if (d) dateNote = ` Date estimated: ${fmtDate(date)}.` }
    // An empty field is unknown. If it held an estimate before, that stays as a fallback and is worked out again.
    const draft = { date, estimated: [], country };
    for (const [k, v] of [["odometer", input.odo], ["volume", input.vol], ["total", input.tot]]) {
      if (v != null) draft[k] = v; else if (old && isEst(old, k)) { draft[k] = old[k]; draft.estimated.push(k) } else draft[k] = 0;
    }
    const c = completeFill(b, draft, sources, fillId);
    const missing = fillMissing(c, b); if (missing) { toast(missing, 6000); return null }
    const fields = { date: iso(c.fill.date), odometer: c.fill.odometer, volume: c.fill.volume, total: c.fill.total, full: !!input.full, country: c.fill.country };
    if (old) { Object.assign(old, fields); if (c.fill.estimated.length) old.estimated = c.fill.estimated; else delete old.estimated }
    else b.fuel.push({ id: uuid(), ...fields, ...(c.fill.estimated.length ? { estimated: c.fill.estimated } : {}) });
    const placeNote = input.country || b.unit !== "km" ? ""
      : nearBorder ? ` Close to a border: saved as ${placeName(country)}; change it on the fill if that's wrong.`
      : input.shown && input.shown !== country ? ` Saved as bought in ${placeName(country)}, from ${hereFrom()}.` : "";
    return { b, note: (fillNote(b, c) + dateNote + placeNote).trim() };
  } finally { savingFill = false }
}

// ---------- Rendering ----------
// What you type in the Log forms is kept as a draft (per bike, on this phone) until you save it, so a
// redraw, switching to another app, or the iPhone closing the page in the background never loses it.
const DRAFTS = "garagebook.drafts.v1", DRAFT_FORMS = ["odoForm", "fuelForm"];
const loadDrafts = () => { try { return JSON.parse(localStorage.getItem(DRAFTS) || "{}") || {} } catch { return {} } };
const saveDrafts = d => { try { localStorage.setItem(DRAFTS, JSON.stringify(d)) } catch {} };
function keepDraft(el) {
  const form = el.closest("form"); if (!form || !DRAFT_FORMS.includes(form.id) || !el.id || !S.bike) return;
  const d = loadDrafts(), mine = d[S.bike] ??= {}, f = mine[form.id] ??= {};
  f[el.id] = el.type === "checkbox" ? el.checked : el.value;
  saveDrafts(d);
}
function restoreDrafts() {
  const mine = loadDrafts()[S.bike] || {};
  for (const id of DRAFT_FORMS) for (const [field, v] of Object.entries(mine[id] || {})) {
    const el = document.getElementById(field);
    if (!el || el.closest("form")?.id !== id) continue;
    if (el.type === "checkbox") el.checked = !!v; else el.value = String(v);
    if (el.dataset.auto && el.value) delete el.dataset.auto;   // a country you picked yourself
  }
}
function clearDraft(formId) { const d = loadDrafts(); if (d[S.bike]) { delete d[S.bike][formId]; saveDrafts(d) } }
document.addEventListener("input", e => keepDraft(e.target));
document.addEventListener("change", e => keepDraft(e.target));

// Background syncs only redraw the page when the garage really changed, and never while you're typing

let redrawWaiting = false;
const typing = () => { const a = document.activeElement; return !!a && $("#view").contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) };
function renderQuietly() { if (typing()) { redrawWaiting = true; renderChip() } else render() }
document.addEventListener("focusout", () => setTimeout(() => { if (redrawWaiting && !typing()) { redrawWaiting = false; render() } }, 0));

function render() {
  redrawWaiting = false;
  const b = bike();
  S.bike = b?.id ?? null;
  $("#bike").innerHTML = bikes().map(x => `<option value="${esc(x.id)}"${x.id === S.bike ? " selected" : ""}>${esc(x.name)}</option>`).join("");

}
function renderChip() {
  const chip = $("#syncChip"), text = $("#syncText");

  renderChip();

  const v = $("#view");
  if (!b) { v.innerHTML = `<section><div class="card"><h2>No bikes</h2><p class="muted">${S.session ? "Your online garage is empty. Sign in on the Mac app with the same account to upload your bikes, or add one here." : "Sign in to see your garage."}</p><div class="btns">${S.session ? '<button class="btn" data-act="newBike">Add bike</button>' : '<button class="btn" data-act="account">Sign in</button>'}</div></div></section>`; return }
  const banner = S.example ? `<section><div class="banner example"><span>This is an <b>example bike</b>. Sign in to see your own garage.</span><button class="linkbtn" data-act="account">Sign in</button></div></section>`

  renderSide();

    service: isDesk() ? x => service(x) + '<section><div class="card form"><b>Service schedule from the booklet</b><p class="small muted" style="margin:0">Read the intervals from your owner\'s manual (PDF) into the schedule.</p><button class="btn ghost" type="button" data-act="booklet">Read service booklet</button></div></section>' : service, papers, photos, schematics, wear, mods, checklists, restoration, shopping, finder: finderPage, due, exports };

function jobRow(it) {

  return `<div class="job${due ? " due" : ""}">
    ${due && !it.kind && !String(it.id).startsWith("wear-")
      ? `<button type="button" class="icon" data-done="${esc(it.id)}" aria-label="${esc(it.title)}: mark as done">${iconFor(it)}</button>`

// The number shown big behind the bike's name: the engine size. A 125 shows 125, a 599 cc bike shows 600.
function engineSize(b) {
  const pick = (text, noYears) => (String(text || "").match(/\d{2,4}/g) || []).map(Number).find(n => n >= 50 && n <= 2500 && !(noYears && n >= 1900 && n <= 2099));
  const fromModel = pick(b.model);
  if (fromModel) return String(fromModel);
  const fact = (b.research?.facts || []).find(f => /^displacement$/i.test(f?.label || ""));
  const m = fact && String(fact.value ?? "").match(/(\d{2,4}(?:\.\d+)?)\s*(?:cc|cm)/i);
  if (m) { const n = Math.round(+m[1]), r = Math.round(n / 50) * 50; return String(Math.abs(r - n) <= 5 ? r : n) }
  const fromName = pick(b.name, true);
  return fromName ? String(fromName) : "";
}

function wear(b) {
  const list = (b.wear || []).slice().sort((x, y) => D(y.date) - D(x.date));
  const cards = Object.entries(WEAR).map(([c, [limit, up, unit]]) => {
    const rs = list.filter(w => w.component === c), last = rs[0];
    const worn = last && (up ? last.value >= limit : last.value <= limit), near = last && !worn && (up ? last.value >= limit * 0.8 : last.value <= limit + 0.5);
    return `<div class="card"><div class="row" style="border:0;padding-top:0"><b>${esc(c)}</b>${last ? `<span class="num" style="color:var(${worn ? "--over" : near ? "--soon" : "--ok"})">${fmtNum(last.value, 1)} ${esc(unit)}</span>` : '<span class="muted small">No reading</span>'}</div>
      <p class="small muted" style="margin:0">Replace at ${fmtNum(limit, 1)} ${esc(unit)}${worn ? " · <b style=\"color:var(--over)\">replace now</b>" : near ? " · getting close" : ""}</p>
      ${rs.slice(0, 6).map(r => `<div class="row"><span class="small">${fmtDate(r.date)}${r.odometer != null ? ` · ${fmtNum(r.odometer)} ${esc(b.unit)}` : ""}</span><span class="num">${fmtNum(r.value, 1)}</span><button class="linkbtn" type="button" data-wear="${esc(r.id)}">Edit</button></div>`).join("")}</div>`;
  }).join("");
  return `${pageHead("Tires, chain, brakes", "Measure tread depth, pad thickness and chain stretch now and then. Garagebook warns you when a part reaches its limit.")}
    <section><form class="card form" id="wearForm"><div class="t">New reading</div><div class="fields2">
      <label class="f">Part<select id="wComp">${Object.keys(WEAR).map(c => `<option>${esc(c)}</option>`).join("")}</select></label>
      <label class="f">Value<input id="wVal" inputmode="decimal" required placeholder="mm left or % stretch"></label></div>
      <div class="fields2"><label class="f">Date<input id="wDate" type="date" value="${dateInput(new Date())}"></label><label class="f">Odometer (optional)<input id="wOdo" inputmode="decimal"></label></div>
      <button class="btn">Save reading</button></form></section><section class="grid2">${cards}</section>`;
}
function wearSheet(b, r) {
  openSheet(`${head("Edit reading")}<form class="form" id="eW"><label class="f">${esc(r.component)}<input id="eWv" inputmode="decimal" value="${esc(r.value)}" required></label>
    <label class="f">Date<input id="eWd" type="date" value="${dateInput(r.date)}"></label><label class="f">Odometer<input id="eWo" inputmode="decimal" value="${r.odometer ?? ""}"></label>

}

const modGuess = name => { const n = String(name).toLowerCase(); return MOD_GUESS.find(([, ws]) => ws.some(w => n.includes(w)))?.[0] ?? "Other" };
function syncPartMods(b, before) {
  const was = new Map(before.map(p => [p.id, !!(p.bought && p.mod)]));
  b.mods ||= [];
  for (const p of b.shopping || []) {
    const now = !!(p.bought && p.mod), then = was.get(p.id) ?? false;
    if (now && !then && !b.mods.some(m => m.fromPart === p.id))
      b.mods.push({ id: uuid(), date: iso(new Date()), title: p.name || "Part", category: modGuess(p.name), brand: "", partNumber: p.partNumber || "",
        cost: (p.price || 0) * (p.qty || 1), notes: p.store ? `From the parts list. Bought at ${p.store}.` : "From the parts list.", fromPart: p.id });
    else if (!now && then) b.mods = b.mods.filter(m => m.fromPart !== p.id);
  }
}
function changedParts(b, before) { syncPartMods(b, before); changed(b) }
const snapshot = b => (b.shopping || []).map(p => ({ ...p }));
function shopping(b) {
  const list = (b.shopping || []).slice().sort((x, y) => (x.bought - y.bought) || String(x.name).localeCompare(String(y.name)));
  const c = costs(b), spent = c.running - c.fuel, planned = list.filter(p => !p.bought).reduce((s, p) => s + (p.price || 0) * (p.qty || 1), 0);

    <p class="small muted" style="margin:0">Spent ${fmtMoney(spent)} on parts, service, mods and papers · ${fmtMoney(planned)} still on the list${b.budget > 0 ? ` · ${fmtMoney(b.budget - spent - planned)} left after the list` : ""}</p></div></section>
    <section><div class="btns"><button class="btn" type="button" data-act="newPart">Add part</button></div><div class="card">
    ${list.length ? list.map(p => `<div class="row"><input type="checkbox" data-pbought="${esc(p.id)}"${p.bought ? " checked" : ""} aria-label="Bought">
      <div style="flex:1;min-width:0"><span style="${p.bought ? "text-decoration:line-through" : ""}">${esc(p.name || "Part")}</span><div class="small muted">${[p.partNumber, p.store, p.qty > 1 ? `×${p.qty}` : ""].filter(Boolean).map(esc).join(" · ")}</div></div>
      <button type="button" class="pill${p.mod ? " on" : ""}" data-pmod="${esc(p.id)}" title="${p.mod ? "A mod: once bought it's also under Mods and upgrades" : "Mark as a mod"}">Mod</button>
      <span class="num">${fmtMoney((p.price || 0) * (p.qty || 1))}</span><button class="linkbtn" type="button" data-part="${esc(p.id)}">Edit</button></div>`).join("") : '<p class="muted" style="margin:0">No parts on the list yet. Add them here or from the parts finder.</p>'}</div></section>`;
}
function partSheet(b, p) {

  openSheet(`${head(isNew ? "Add part" : "Edit part")}<form class="form" id="eP"><label class="f">Part<input id="pN" value="${esc(p.name)}" required></label>
    <div class="fields2"><label class="f">Part number<input id="pNo" value="${esc(p.partNumber)}"></label><label class="f">Store<input id="pS" value="${esc(p.store)}"></label></div>

    <button class="btn">Save</button>${isNew ? "" : '<button class="btn danger" type="button" id="pX">Delete part</button>'}</form>`, el => {
    const v = id => el.querySelector(id);

const BK_DIST = /(\d{1,3}(?:[,.  ]\d{3})+|\d{3,6})\s*(km|kilomet(?:er|re)s?|mi\b|miles?)/i;
const BK_MONTHS = /(\d{1,2})\s*(months?|mo\b|mths?|maanden|maand|monate?n?|mois|meses|mesi)/i;
const BK_YEARS = /(\d{1,2})\s*(years?|yrs?|jaar|jaren|jahre?n?|ans?\b|años?|anni|anno)/i;
const BK_EVERY_YEAR = /\b(every year|yearly|annually|jaarlijks|elk jaar|jährlich|annuel|anual)/i;
const bookletJob = line => { const l = line.toLowerCase(); return BOOKLET_JOBS.find(([, ws]) => ws.some(w => l.includes(w)))?.[0] ?? null };

/** Jobs and their intervals from the booklet's lines: a job name, with its numbers on that line or the next two. */
function parseBooklet(lines, unit) {
  const clean = lines.map(l => l.trim()).filter(Boolean), byJob = new Map();
  clean.forEach((line, i) => {
    const name = bookletJob(line); if (!name) return;
    const win = [line, ...clean.slice(i + 1, i + 3).filter(l => !bookletJob(l))].join(" ");
    const iv = { task: name };
    const d = win.match(BK_DIST); if (d) { const v = +d[1].replace(/\D/g, ""); if (v >= 100) iv.everyDistance = bookletConvert(v, /^k/i.test(d[2]), unit) }
    const m = win.match(BK_MONTHS), y = win.match(BK_YEARS);
    if (m && +m[1] >= 1 && +m[1] <= 72) iv.everyMonths = +m[1];
    else if (y && +y[1] >= 1 && +y[1] <= 10) iv.everyMonths = +y[1] * 12;
    else if (BK_EVERY_YEAR.test(win)) iv.everyMonths = 12;
    const has = iv.everyDistance != null || iv.everyMonths != null, old = byJob.get(name);
    if (!old) byJob.set(name, { include: has, iv, source: win.slice(0, 160) });
    else if (old.iv.everyDistance == null && old.iv.everyMonths == null && has) byJob.set(name, { include: true, iv, source: win.slice(0, 160) });

}
let pdfjs = null;
async function pdfLines(file, progress) {
  pdfjs ??= await import("./pdfjs/pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc = "./pdfjs/pdf.worker.min.mjs";
  const doc = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false, enableXfa: false }).promise;
  const out = [];
  for (let p = 1; p <= Math.min(doc.numPages, 400); p++) {
    progress(`Reading page ${p} of ${doc.numPages}…`);
    const items = (await (await doc.getPage(p)).getTextContent()).items.filter(it => typeof it.str === "string");
    // Text pieces on the same height make one line.
    const rows = new Map();
    for (const it of items) { const y = Math.round(it.transform[5] / 3); (rows.get(y) ?? rows.set(y, []).get(y)).push(it) }
    for (const y of [...rows.keys()].sort((a, c) => c - a)) {
      // A space only where there's a gap: a ligature like "fi" often comes as its own piece of "filter".
      let line = "", end = null;
      for (const it of rows.get(y).sort((a, c) => a.transform[4] - c.transform[4])) {
        const x = it.transform[4], size = Math.abs(it.transform[0]) || 10;
        if (end != null && x - end > size * 0.15) line += " ";
        line += it.str; end = x + (it.width || 0);
      }
      out.push(line.normalize("NFKC").replace(/\s+/g, " "));   // NFKC: "ﬁ" → "fi"
    }
  }
  return out;
}
function bookletSheet(b) {

// ---------- Overview widgets on a computer, like the Mac app ----------
// The layout is the bike's "dashboard": [{ id, kind, size }], the same list the Mac app keeps, so it syncs both ways.
// Sizes: small is one of four columns, medium ("Wide") two, large the full row. No list means the default layout.
let arranging = false;
const dashCards = b => b.dashboard ? b.dashboard.map(c => ({ ...c })) : WIDGET_DEFAULTS.map(k => ({ id: uuid(), kind: k, size: WIDGETS[k][1] }));
function moveWidget(b, id, how) {
  const cards = dashCards(b), i = b.dashboard ? cards.findIndex(c => c.id === id) : WIDGET_DEFAULTS.indexOf(id);
  if (i < 0) return;
  if (how === "left" && i > 0) [cards[i - 1], cards[i]] = [cards[i], cards[i - 1]];
  else if (how === "right" && i < cards.length - 1) [cards[i + 1], cards[i]] = [cards[i], cards[i + 1]];
  else if (how === "size") cards[i].size = SIZES[(SIZES.indexOf(cards[i].size) + 1) % 3];
  else if (how === "remove") cards.splice(i, 1);
  else return;
  b.dashboard = cards; changed(b);
}
function dropWidget(b, fromId, toId) {
  const cards = dashCards(b), key = c => b.dashboard ? c.id : c.kind;
  const from = cards.findIndex(c => key(c) === fromId), to = cards.findIndex(c => key(c) === toId);
  if (from < 0 || to < 0 || from === to) return;
  const [c] = cards.splice(from, 1); cards.splice(to, 0, c); b.dashboard = cards; changed(b);
}
const tile = (label, value, sub = "") => `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
function odoChart(b) {
  const pts = readings(b).filter(r => r.date && !isNaN(r.date));
  if (pts.length < 2) return '<p class="muted small">Log a couple of odometer readings to see the chart.</p>';
  const W = 800, H = 220, P = 34, x0 = +pts[0].date, x1 = Math.max(+pts[pts.length - 1].date, x0 + DAY), now = mileage(b), est = now > currentOdo(b) + 0.5;
  const xEnd = est ? Math.max(x1, Date.now()) : x1, lo = Math.min(...pts.map(p => p.value)), hi = Math.max(now, ...pts.map(p => p.value)) || 1;
  const X = t => P + (t - x0) / (xEnd - x0) * (W - P * 2), Y = v => H - P - (v - lo) / ((hi - lo) || 1) * (H - P * 2);
  const line = pts.map(p => `${X(+p.date).toFixed(1)},${Y(p.value).toFixed(1)}`).join(" "), last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Odometer from ${fmtNum(lo)} to ${fmtNum(hi)} ${esc(b.unit)}">
    <line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke="var(--line)"/>
    <text x="${P}" y="${H - 10}" class="ax">${fmtDate(pts[0].date)}</text><text x="${W - P}" y="${H - 10}" class="ax" text-anchor="end">${fmtDate(est ? new Date() : last.date)}</text>
    <text x="${P}" y="${P - 12}" class="ax">${fmtNum(hi)} ${esc(b.unit)}</text>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${est ? `<line x1="${X(+last.date)}" y1="${Y(last.value)}" x2="${X(Date.now())}" y2="${Y(now)}" stroke="var(--accent)" stroke-width="3" stroke-dasharray="6 6"/>` : ""}
    ${pts.map(p => `<circle cx="${X(+p.date).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="4" fill="var(--accent)"/>`).join("")}
  </svg>${est ? '<p class="small muted" style="margin:0">Dashed: estimated since your last reading.</p>' : ""}`;
}
function widgetBody(b, kind) {
  const vol = b.unit === "km" ? "L" : "gal", up = upcoming(b), next = up.find(x => x.status !== "unknown");
  switch (kind) {
    case "odometer": { const now = mileage(b), est = now > currentOdo(b) + 0.5; return tile(est ? "Odometer, estimated" : "Odometer", `${est ? "≈ " : ""}${fmtNum(now)} <span style="font-size:14px">${esc(b.unit)}</span>`) }
    case "perWeek": { const a = weeklyAverage(b); return tile("Per week", a == null ? "—" : `${fmtNum(a)} <span style="font-size:14px">${esc(b.unit)}</span>`, a == null ? "Log two readings two weeks apart" : "") }
    case "services": return tile("Services", fmtNum(b.services.length));
    case "runningCost": return tile("Running cost", fmtMoney(costs(b).running));
    case "economy": { const e = economy(b); return tile("Economy", e ? `${fmtNum(e, 1)} <span style="font-size:14px">${esc(b.unit)}/${vol}</span>` : "—") }
    case "restoration": { const r = b.restoration || []; return tile("Restoration", r.length ? `${Math.round(r.filter(s => s.done).length / r.length * 100)}%` : "—") }
    case "photos": return tile("Photos", fmtNum(b.photos.length));
    case "nextJob": return tile("Next job", next ? `<span style="font-size:22px">${esc(next.title)}</span>` : "—", next ? esc(next.detail) : "Nothing scheduled");
    case "upcoming": return `<h3>Upcoming maintenance</h3><div class="jobs">${up.map(jobRow).join("") || '<p class="muted">No schedule yet. Read your service booklet under Service.</p>'}</div>`;
    case "logOdometer": return `<h3>Log odometer</h3><p class="small muted" style="margin:0">${b.odometer.length} readings. Last: ${fmtNum(currentOdo(b))} ${esc(b.unit)}.</p><div class="btns"><button class="btn" type="button" data-go="log">Log odometer</button></div>`;
    case "logFuel": return `<h3>Log fuel</h3><p class="small muted" style="margin:0">${b.fuel.length} fills logged.</p><div class="btns"><button class="btn" type="button" data-go="log">Log fuel</button></div>`;
    case "chart": return `<h3>Odometer over time</h3>${odoChart(b)}`;
    case "history": {
      const bought = purchaseReading(b);
      return `<h3>History since you bought it</h3>${bought
        ? `<p class="small muted" style="margin:0">The history starts at the ${fmtNum(bought.value)} ${esc(b.unit)} on the day you bought it (${fmtDate(bought.date)}). That counts as a reading, so nothing has to be guessed.</p>`
        : `<label class="f">My guess, ${esc(b.unit)} a week<input id="wGuess" inputmode="decimal" value="${b.guessedWeekly ?? ""}" placeholder="e.g. 80"></label><p class="small muted" style="margin:0">Only used to draw the history before your first reading. Add the odometer when bought under <button class="linkbtn" type="button" data-act="editBike">Edit bike</button> and no guess is needed.</p>`}`;
    }
    case "story": return `<h3>The story</h3><textarea id="wStory" rows="4" maxlength="20000" aria-label="The story" placeholder="Where it came from, what you did to it…">${esc(b.story || "")}</textarea>`;
    case "report": return `<h3>History report</h3><p class="small muted" style="margin:0">Service history, mods, papers and costs on a few pages. Print it or save it as a PDF.</p><div class="btns"><button class="btn ghost" type="button" data-act="report">Make report</button></div>`;
  }
  return "";
}
function deskOverview(b) {

  const missing = Object.keys(WIDGETS).filter(k => !cards.some(c => c.kind === k));

      <div class="grid2"><button class="btn" data-act="newService">Log a service</button><button class="btn ghost" data-go="log">Log odometer or fuel</button></div>

  ${cards.length ? "" : '<div class="card"><p class="muted">No widgets. Add some with Edit widgets, or reset the layout.</p></div>'}</section>
  <p class="small muted" style="margin:18px 0 0">Bike silhouette traced from a photo on Wikimedia Commons, CC BY 2.5.</p>`;
