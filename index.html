<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-nZfEZYmpf/PMCcprqKCwzXXK/oooOrA8c6DNoufdZwU='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob:; connect-src https://gnroryugxfcqgwrbhkmn.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">

<style>
/* Layout: one narrow column like a workshop logbook, a gauge-style odometer up top, tabs pinned at the bottom for one-handed use. */
:root {
  --bg: #eef0f1; --surface: #ffffff; --sunk: #e3e6e8; --fg: #16191c; --muted: #5d666e; --line: #d3d8dc;
  --accent: #1f5f8b; --accent-fg: #ffffff; --ok: #2f8a57; --soon: #d9770a; --over: #c43b2f;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111417; --surface: #1b1f23; --sunk: #23282d; --fg: #e9edf0; --muted: #98a2ab; --line: #2e353b;
  --accent: #6fb2e0; --accent-fg: #0d1a24; --ok: #55c486; --soon: #f29a35; --over: #f0675a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111417; --surface: #1b1f23; --sunk: #23282d; --fg: #e9edf0; --muted: #98a2ab; --line: #2e353b;
  --accent: #6fb2e0; --accent-fg: #0d1a24; --ok: #55c486; --soon: #f29a35; --over: #f0675a; color-scheme: dark }

* { box-sizing: border-box }
html, body { background: var(--bg); color: var(--fg) }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100% }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 620px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px)) }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: .01em; margin: 0; text-wrap: balance }
h2 { font-size: 22px }
h3 { font-size: 18px }
.num { font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.small { font-size: 13px }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: 12px 10px }
.top select { flex: 1; min-width: 0; font-family: var(--display); font-size: 24px; font-weight: 600; background: none; border: 0; padding: 0; appearance: none; -webkit-appearance: none; text-overflow: ellipsis }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; border: 1px solid var(--line); background: var(--surface); white-space: nowrap }
.chip .dot { width: 8px; height: 8px; border-radius: 50% }
.chip.dirty { border-color: var(--soon); color: var(--soon) }
.banner { border-radius: var(--r); padding: 12px 14px; background: var(--sunk); font-size: 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap }
.banner.example { border: 1px dashed var(--muted) }

/* Sections */
section { display: flex; flex-direction: column; gap: 12px; margin-top: 18px }
.card { background: var(--surface); border-radius: var(--r); padding: 14px 16px; border: 1px solid var(--line) }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.stat .label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.stat .value { font-family: var(--display); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1 }
.stat .sub { font-size: 12px; color: var(--muted) }

/* Odometer gauge */
.odo { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px }
.odo .digits { display: flex; gap: 3px }
.odo .digits span { font-family: var(--display); font-weight: 600; font-size: 40px; line-height: 1; background: var(--fg); color: var(--bg); border-radius: 5px; padding: 6px 4px 4px; min-width: 28px; text-align: center; font-variant-numeric: tabular-nums }
.odo .unit { font-family: var(--display); font-size: 20px; color: var(--muted) }

/* Job rows */
.jobs { display: flex; flex-direction: column }
.job { display: grid; grid-template-columns: 32px 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line) }
.job:first-child { border-top: 0 }
.job .icon { grid-row: span 2; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--sunk); color: var(--muted) }
.job.due .icon { background: color-mix(in srgb, var(--soon) 18%, transparent); color: var(--soon) }
.job .icon svg { width: 18px; height: 18px }
.job .name { font-weight: 500; min-width: 0 }
.job .when { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap }
.bar { grid-column: 2 / 4; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--ok) }
.bar i.soon { background: var(--soon) } .bar i.over { background: var(--over) }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 8px; white-space: nowrap }
.pill.over { background: color-mix(in srgb, var(--over) 16%, transparent); color: var(--over) }
.pill.soon { background: color-mix(in srgb, var(--soon) 18%, transparent); color: var(--soon) }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok) }

/* Lists and forms */
.rows { display: flex; flex-direction: column }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center }
.row:first-child { border-top: 0 }
.row > div { min-width: 0 }
.row .t { font-weight: 500; overflow-wrap: anywhere }
.row.tap { cursor: pointer }
.row .warn { color: var(--soon); font-size: 12px }
form, .form { display: flex; flex-direction: column; gap: 10px }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted) }
label.f input, label.f select, label.f textarea { font-size: 16px; color: var(--fg); background: var(--sunk); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; width: 100%; min-width: 0 }
.fields2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px }
.fields2 > * { min-width: 0 }
/* iPhone Safari gives date fields their own minimum width, height and centred text; make them match the others. */
label.f input, label.f select { height: 44px; line-height: 22px }
label.f input[type="date"] { -webkit-appearance: none; appearance: none; display: block; max-width: 100%; text-align: left }
label.f input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0 }
label.f input[type="date"]::-webkit-calendar-picker-indicator { margin: 0 }
.check { display: flex; gap: 10px; align-items: center; font-size: 15px; color: var(--fg) }
.check input { width: 20px; height: 20px; accent-color: var(--accent) }
.btn { border: 0; border-radius: 10px; padding: 12px 16px; font-weight: 600; background: var(--accent); color: var(--accent-fg) }
.btn.ghost { background: var(--sunk); color: var(--fg) }
.btn.danger { background: none; color: var(--over); padding-inline: 0 }
.btn:disabled { opacity: .45 }
.btns { display: flex; gap: 10px; flex-wrap: wrap }
.btns .btn { flex: 1 }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600 }

/* Task picker */
.tasks { display: flex; flex-direction: column; max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 9px; background: var(--sunk) }
.task { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 15px; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100% }
.task:first-child { border-top: 0 }
.task .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--muted); flex: none; display: grid; place-items: center }
.task.on .box { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }
.task .every { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap }

/* Bottom tabs */
nav.tabs { position: fixed; inset: auto 0 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)) }
nav.tabs button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--muted); padding: 6px 0 }
nav.tabs button svg { width: 22px; height: 22px }
nav.tabs button[aria-current="page"] { color: var(--accent) }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, #000 45%, transparent); display: flex; align-items: flex-end; justify-content: center }
.sheet { background: var(--bg); width: 100%; max-width: 620px; max-height: 92%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px }
.sheet header { display: flex; justify-content: space-between; align-items: center; gap: 10px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px) }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px }
.ph { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 0; overflow: hidden; display: flex; flex-direction: column; text-align: left }
.ph img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--sunk); display: block }
.ph span { font-size: 13px; padding: 8px 10px; overflow-wrap: anywhere }
.big { width: 100%; max-width: 100%; border-radius: var(--r); background: var(--sunk); min-height: 120px }
.receipt { width: 100%; max-height: 260px; object-fit: contain; border-radius: 9px; background: var(--sunk) }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out } @keyframes up { from { transform: translateY(24px); opacity: .6 } } }
html { padding-top: env(safe-area-inset-top, 0px) }
body { margin: 0 }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <select id="bike" aria-label="Bike"></select>
    <button class="chip" id="syncChip" type="button"><span class="dot"></span><span id="syncText">Sync</span></button>
  </div>
  <div id="view"></div>
</div>

<nav class="tabs" id="tabs">
  <button type="button" data-tab="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-6"/></svg>Overview</button>
  <button type="button" data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 20V5a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v15"/><path d="M3 20h13"/><path d="M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/><path d="M7 8h5"/></svg>Log</button>
  <button type="button" data-tab="service"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>Service</button>
  <button type="button" data-tab="papers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h6"/></svg>Papers</button>
  <button type="button" data-tab="photos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Photos</button>
</nav>

<script>
"use strict";
if (window.top !== window.self) { document.documentElement.innerHTML = ""; throw new Error("Garagebook can't run inside a frame.") }
// ---------- Storage on this phone (a copy; the online garage is the shared one) ----------
const KEY = "garagebook.web.v1";
function loadState() { try { return JSON.parse(localStorage.getItem(KEY) || "null") } catch { return null } }
function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)) } catch {} }

// ---------- Helpers ----------
const DAY = 86400000;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16) })).toUpperCase();
// Garagebook on the Mac reads ISO dates without fractions of a second.
const iso = d => new Date(d).toISOString().replace(/\.\d{3}Z$/, "Z");
const D = s => s ? new Date(s) : null;
const lang = navigator.language || "en";
const region = (lang.split("-")[1] || "").toUpperCase();
const CURRENCY = ({ US: "USD", GB: "GBP", CH: "CHF", SE: "SEK", NO: "NOK", DK: "DKK", PL: "PLN", CA: "CAD", AU: "AUD", JP: "JPY" })[region] || "EUR";
const fmtMoney = v => new Intl.NumberFormat(lang, { style: "currency", currency: CURRENCY }).format(v || 0);
const fmtNum = (v, d = 0) => new Intl.NumberFormat(lang, { maximumFractionDigits: d, minimumFractionDigits: d }).format(v || 0);
// Dates are always day/month/year, like 06/11/2027.
const fmtDate = d => { const x = new Date(d); if (isNaN(x)) return ""; const p = n => String(n).padStart(2, "0"); return `${p(x.getDate())}/${p(x.getMonth() + 1)}/${x.getFullYear()}` };
const dateInput = d => { const x = new Date(d); return new Date(x.getTime() - x.getTimezoneOffset() * 60000).toISOString().slice(0, 10) };
const fromDateInput = (s, keepTime) => { if (!s) return null; const [y, m, d] = s.split("-").map(Number); const t = keepTime ? new Date(keepTime) : new Date(); return new Date(y, m - 1, d, t.getHours(), t.getMinutes(), t.getSeconds()) };
const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x };
function addMonths(d, n) { // like Calendar.date(byAdding: .month): clamps to the end of shorter months
  const x = new Date(d), day = x.getDate();
  x.setDate(1); x.setMonth(x.getMonth() + n);
  const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate();
  x.setDate(Math.min(day, last)); return x;
}
// A time interval is in weeks (everyWeeks, set in the Mac app) or months; weeks win.
const hasTime = iv => iv.everyWeeks > 0 || iv.everyMonths > 0;
const nextTime = (iv, d) => iv.everyWeeks > 0 ? new Date(d.getTime() + Math.min(iv.everyWeeks, 5200) * 7 * DAY) : addMonths(d, Math.min(iv.everyMonths, 1200));
function monthsBetween(a, b) { let m = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()); if (addMonths(a, m) > b) m--; return m }
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null };

// ---------- Garage logic (same rules as the Mac and iPhone app) ----------
function readings(b) {
  return [
    ...b.odometer.map(r => ({ date: D(r.date), value: r.value })),
    ...b.services.filter(s => s.odometer != null).map(s => ({ date: D(s.date), value: s.odometer })),
    ...b.fuel.map(f => ({ date: D(f.date), value: f.odometer })),
    ...(b.wear || []).filter(w => w.odometer != null).map(w => ({ date: D(w.date), value: w.odometer })),
  ].sort((x, y) => x.date - y.date);
}
const currentOdo = b => Math.max(0, ...readings(b).map(r => r.value));
const firstOdo = b => { const v = [...b.odometer.map(r => r.value), ...b.services.filter(s => s.odometer != null).map(s => s.odometer), ...b.fuel.map(f => f.odometer)]; return v.length ? Math.min(...v) : 0 };
function weeklyAverage(b) {
  const all = readings(b); if (!all.length) return null;
  const last = all[all.length - 1];
  const recent = all.filter(r => r.date >= new Date(last.date - 182 * DAY));
  const rate = pts => {
    if (!pts.length) return null;
    const a = pts[0], top = pts.reduce((m, p) => p.value > m.value ? p : m, pts[0]);
    const days = (top.date - a.date) / DAY;
    return days >= 14 && top.value > a.value ? (top.value - a.value) / days * 7 : null;
  };
  return rate(recent) ?? rate(all);
}
function mileage(b, now = new Date()) {
  const rec = currentOdo(b), avg = weeklyAverage(b);
  if (b.autoMileage === false || avg == null) return rec;
  const tops = readings(b).filter(r => r.value >= rec); if (!tops.length) return rec;
  const top = tops.reduce((m, r) => r.date > m.date ? r : m);
  const days = (now - top.date) / DAY;
  return days > 0 ? rec + avg * days / 7 : rec;
}
const covers = (s, task) => (s.tasks || []).some(t => t.toLowerCase() === task.toLowerCase());
function lastService(b, task) { return b.services.filter(s => covers(s, task)).sort((x, y) => D(y.date) - D(x.date))[0] }
const ORDER = { overdue: 0, soon: 1, ok: 2, unknown: 3 };
function status(b, iv, now = new Date()) {
  const base = { id: iv.id, title: iv.task, status: "unknown", detail: "No service logged yet", progress: null };
  const last = lastService(b, iv.task); if (!last) return base;
  const parts = []; let st = "ok", progress = null;
  const odo = mileage(b, now), u = b.unit;
  if (iv.everyDistance && last.odometer != null) {
    const left = last.odometer + iv.everyDistance - odo;
    progress = (odo - last.odometer) / iv.everyDistance;
    parts.push(left < 0 ? `${fmtNum(-left)} ${u} over` : `in ${fmtNum(left)} ${u}`);
    if (left < 0) st = "overdue";
  }
  if (hasTime(iv)) {
    const ld = D(last.date), next = nextTime(iv, ld);
    const days = Math.trunc((next - now) / DAY), span = next - ld;
    if (span > 0) progress = Math.max(progress ?? 0, (now - ld) / span);
    parts.push(days < 0 ? `${-days} days late` : `by ${fmtDate(next)}`);
    if (days < 0) st = "overdue";
  }
  if (st === "ok" && progress != null && progress >= 0.8) st = "soon";
  return { ...base, status: st, progress, detail: parts.length ? parts.join(" · ") : `Last done ${fmtDate(last.date)}` };
}
function paperItems(b) {
  return b.papers.filter(p => p.expires).map(p => {
    const days = Math.trunc((D(p.expires) - new Date()) / DAY);
    return { id: p.id, title: `${p.kind} renewal`, kind: "paper", status: days < 0 ? "overdue" : days <= 30 ? "soon" : "ok",
             detail: days < 0 ? `Expired ${fmtDate(p.expires)}` : `Expires ${fmtDate(p.expires)}`, progress: null };
  });
}
const WEAR = { "Front tire": [1.6, false, "mm left"], "Rear tire": [1.6, false, "mm left"], "Chain": [1.5, true, "% stretch"], "Front pads": [1.5, false, "mm left"], "Rear pads": [1.5, false, "mm left"] };
function wearItems(b) {
  return Object.entries(WEAR).flatMap(([c, [limit, up, unit]]) => {
    const r = (b.wear || []).filter(w => w.component === c).sort((x, y) => D(y.date) - D(x.date))[0];
    if (!r || !(up ? r.value >= limit : r.value <= limit)) return [];
    return [{ id: "wear-" + c, title: `Replace ${c.toLowerCase()}`, status: "overdue", detail: `${fmtNum(r.value, 1)} ${unit}`, progress: null }];
  });
}
function upcoming(b) {
  const items = [...b.intervals.map(iv => status(b, iv)), ...paperItems(b), ...wearItems(b)];
  const key = d => [d.status === "unknown" ? 1 : 0, -(d.progress ?? (d.status === "overdue" ? 2 : d.status === "soon" ? 0.9 : 0))];
  return items.sort((x, y) => { const a = key(x), c = key(y); return a[0] - c[0] || a[1] - c[1] });
}
// Papers paid monthly or yearly count every payment from their start (or the purchase date) until today or when stopped.
function payments(b, p, now = new Date()) {
  const plan = p.billing || "One-off"; if (plan === "One-off") return 1;
  const first = p.since || b.purchaseDate; if (!first) return 1;
  const start = startOfDay(D(first)), until = p.until && D(p.until) < now ? D(p.until) : now, end = startOfDay(until);
  if (end < start) return 0;
  const m = monthsBetween(start, end);
  return (plan === "Monthly" ? m : Math.floor(m / 12)) + 1;
}
const paid = (b, p) => (p.cost || 0) * payments(b, p);
const perMonth = b => b.papers.filter(p => (p.billing || "One-off") !== "One-off" && (!p.until || D(p.until) >= new Date()))

  const mods = (b.mods || []).reduce((s, x) => s + (x.cost || 0), 0), papers = b.papers.reduce((s, p) => s + paid(b, p), 0);

  for (const f of fills) { pending += f.volume; if (f.full) { if (lastFull) { dist += f.odometer - lastFull.odometer; vol += pending } lastFull = f; pending = 0 } }

const isOil = t => /oil|olie|öl|huile/i.test(t) && !/fork|voor|gabel|fourche|brake|rem|brems|frein/i.test(t);
function milestones(b, top) {

  const oil = b.intervals.find(i => isOil(i.task) && (i.everyDistance || 0) >= 1000)?.everyDistance;
  const counts = {}; ds.filter(d => d >= 1000).forEach(d => counts[d] = (counts[d] || 0) + 1);
  const common = Object.entries(counts).sort((a, c) => c[1] - a[1] || a[0] - c[0])[0];

const jobsAt = (b, m) => b.intervals.filter(iv => iv.everyDistance > 0 && m / iv.everyDistance >= 1 && Math.abs(m / iv.everyDistance - Math.round(m / iv.everyDistance)) < 0.001).map(iv => iv.task);

// ---------- Merging with the online copy (newest edit of each bike wins; deletes stay deleted) ----------
function deletedMap(list) { const m = Object.create(null); for (let i = 0; i + 1 < (list || []).length; i += 2) if (/^[0-9A-Fa-f-]{36}$/.test(list[i])) m[list[i]] = list[i + 1]; return m }
function deletedList(m) { return Object.entries(m).flat() }
function merge(mine, disk) {
  const del = deletedMap(mine.deleted);
  for (const [id, at] of Object.entries(deletedMap(disk.deleted))) del[id] = !del[id] || D(at) > D(del[id]) ? at : del[id];
  const byId = Object.fromEntries(mine.bikes.map(b => [b.id, b]));
  for (const b of disk.bikes) { const m = byId[b.id]; if (m && D(m.updatedAt) >= D(b.updatedAt)) continue; byId[b.id] = b }
  const order = [...mine.bikes.map(b => b.id), ...disk.bikes.map(b => b.id).filter(id => !mine.bikes.some(b => b.id === id))];
  return { bikes: order.map(id => byId[id]).filter(b => b && !(del[b.id] && D(del[b.id]) >= D(b.updatedAt))), deleted: deletedList(del) };
}
// Synced or stored data is not trusted: numbers must be numbers, the unit is km or mi, ids are
// plain, and dates from the future are pulled back to now so they can't win every merge forever.
const NUMERIC = new Set(["value", "odometer", "volume", "total", "cost", "everyDistance", "everyMonths", "everyWeeks", "year", "guessedWeekly",
  "purchaseOdometer", "purchasePrice", "price", "budget", "quantity", "limit", "mileage", "km"]);
const DATES = new Set(["date", "expires", "since", "until", "purchaseDate", "updatedAt", "installed", "doneAt", "due"]);
const LISTS = ["odometer", "services", "fuel", "mods", "papers", "wear", "checklists", "restoration", "shopping", "photos", "intervals"];
function scrub(x, depth = 0) {
  if (depth > 12 || !x || typeof x !== "object") return;
  for (const bad of ["__proto__", "constructor", "prototype"]) if (Object.prototype.hasOwnProperty.call(x, bad)) delete x[bad];
  for (const k of Object.keys(x)) {
    const v = x[k];
    if (NUMERIC.has(k) && !(depth === 0 && LISTS.includes(k))) {   // a bike's "odometer" is its list of readings
      // A number field holds a number, or a digit string that becomes one; anything else is dropped.
      const n = typeof v === "number" ? v : typeof v === "string" ? Number(v) : NaN;
      if (v == null) continue; else if (Number.isFinite(n)) x[k] = n; else delete x[k];
    }
    else if (DATES.has(k) && v != null && (typeof v !== "string" || isNaN(new Date(v)))) delete x[k];
    else if (typeof v === "number" && !Number.isFinite(v)) delete x[k];
    else if (v && typeof v === "object") scrub(v, depth + 1);

}
function clean(f) {
  if (!validFile(f) || f.bikes.length > 500) return null;
  const cap = Date.now() + 300000, seen = new Set();
  f.bikes = f.bikes.filter(b => typeof b.id === "string" && /^[0-9A-Fa-f-]{36}$/.test(b.id) && !seen.has(b.id) && seen.add(b.id));
  for (const b of f.bikes) {
    // Every list is a list (at most 5000 entries) of objects, so views never meet null or text.
    for (const k of LISTS) b[k] = Array.isArray(b[k]) ? b[k].filter(x => x && typeof x === "object" && !Array.isArray(x)).slice(-5000) : [];
    scrub(b);
    b.unit = b.unit === "mi" ? "mi" : "km";
    if (!(D(b.updatedAt) <= cap)) b.updatedAt = iso(Math.min(D(b.updatedAt)?.getTime() || 0, cap));
  }
  const del = Array.isArray(f.deleted) ? f.deleted : [];
  f.deleted = [];
  for (let i = 0; i + 1 < del.length && i < 10000; i += 2)
    if (typeof del[i] === "string" && D(del[i + 1]) && !isNaN(D(del[i + 1]))) f.deleted.push(del[i], iso(Math.min(D(del[i + 1]).getTime(), cap)));

}
const SAFE_NAME = n => typeof n === "string" && n.length <= 128 && /^[A-Za-z0-9_-][A-Za-z0-9._-]*$/.test(n) && !n.includes("..");
function validFile(f) { return f && Array.isArray(f.bikes) && f.bikes.every(b => b && b.id && Array.isArray(b.odometer) && Array.isArray(b.services) && Array.isArray(b.intervals) && Array.isArray(b.fuel) && Array.isArray(b.papers)) }

let sheet = null, toastTimer = null;

// ---------- Rendering ----------
// What you type in the Log forms is kept as a draft (per bike, on this phone) until you save it, so a
// redraw, switching to another app, or the iPhone closing the page in the background never loses it.
const DRAFTS = "garagebook.drafts.v1", DRAFT_FORMS = ["odoForm", "fuelForm"];
const loadDrafts = () => { try { return JSON.parse(localStorage.getItem(DRAFTS) || "{}") || {} } catch { return {} } };
const saveDrafts = d => { try { localStorage.setItem(DRAFTS, JSON.stringify(d)) } catch {} };
function keepDraft(el) {
  const form = el.closest("form"); if (!form || !DRAFT_FORMS.includes(form.id) || !el.id || !S.bike) return;
  const d = loadDrafts(), mine = d[S.bike] ??= {}, f = mine[form.id] ??= {};
  f[el.id] = el.type === "checkbox" ? el.checked : el.value;
  saveDrafts(d);
}
function restoreDrafts() {
  const mine = loadDrafts()[S.bike] || {};
  for (const id of DRAFT_FORMS) for (const [field, v] of Object.entries(mine[id] || {})) {
    const el = document.getElementById(field);
    if (!el || el.closest("form")?.id !== id) continue;
    if (el.type === "checkbox") el.checked = !!v; else el.value = String(v);
  }
}
function clearDraft(formId) { const d = loadDrafts(); if (d[S.bike]) { delete d[S.bike][formId]; saveDrafts(d) } }
document.addEventListener("input", e => keepDraft(e.target));
document.addEventListener("change", e => keepDraft(e.target));

// Background syncs only redraw the page when the garage really changed, and never while you're typing
// in it: then they wait until you leave the field.
let redrawWaiting = false;
const typing = () => { const a = document.activeElement; return !!a && $("#view").contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) };
function renderQuietly() { if (typing()) { redrawWaiting = true; renderChip() } else render() }
document.addEventListener("focusout", () => setTimeout(() => { if (redrawWaiting && !typing()) { redrawWaiting = false; render() } }, 0));

function render() {
  redrawWaiting = false;
  const b = bike();
  S.bike = b?.id ?? null;
  $("#bike").innerHTML = bikes().map(x => `<option value="${esc(x.id)}"${x.id === S.bike ? " selected" : ""}>${esc(x.name)}</option>`).join("");
  renderView(b);
}
function renderChip() {
  const chip = $("#syncChip"), text = $("#syncText");
  chip.classList.toggle("dirty", !!S.dirty);
  chip.querySelector(".dot").style.background = !S.session ? "var(--muted)" : lastError ? "var(--over)" : S.dirty || syncing ? "var(--soon)" : "var(--ok)";
  text.textContent = !S.session ? "Sign in" : syncing ? "Syncing…" : lastError ? "Not synced" : S.dirty ? "Waiting to sync" : "Synced";
}
function renderView(b) {
  renderChip();

  const v = $("#view");
  if (!b) { v.innerHTML = `<section><div class="card"><h2>No bikes</h2><p class="muted">${S.session ? "Your online garage is empty. Sign in on the Mac app with the same account to upload your bikes, or add one here." : "Sign in to see your garage."}</p><div class="btns">${S.session ? '<button class="btn" data-act="newBike">Add bike</button>' : '<button class="btn" data-act="account">Sign in</button>'}</div></div></section>`; return }
  const banner = S.example ? `<section><div class="banner example"><span>This is an <b>example bike</b>. Sign in to see your own garage.</span><button class="linkbtn" data-act="account">Sign in</button></div></section>`

function jobRow(it) {
  const due = it.status === "overdue" || it.status === "soon";
  const pct = it.progress == null ? null : Math.max(0, Math.min(1, it.progress));
  const cls = it.status === "overdue" ? "over" : it.status === "soon" ? "soon" : "";
  return `<div class="job${due ? " due" : ""}">
    <div class="icon" aria-hidden="true">${iconFor(it)}</div>
    <div class="name">${esc(it.title)}</div>
    <div class="when">${it.status === "unknown" ? "No record" : esc(it.detail)}</div>
    ${pct != null ? `<div class="bar" role="progressbar" aria-valuenow="${Math.round(pct * 100)}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(it.title)}"><i class="${cls}" style="width:${(pct * 100).toFixed(1)}%"></i></div>` : `<div class="small muted" style="grid-column:2/4">${it.status === "unknown" ? "Log it once to start the countdown" : ""}</div>`}
  </div>`;
}

function overview(b) {

  const digits = String(Math.round(now)).padStart(6, "0").split("").map(d => `<span>${d}</span>`).join("");

    <div class="card">

function log(b) {

      <label class="f">Date<input id="fDate" type="date" value="${dateInput(new Date())}"></label>

  const receipts = b.services.filter(s => s.receipt).sort((x, y) => D(y.date) - D(x.date));
  return `<section><div class="btns"><button class="btn" data-act="addPhoto">Add photo</button></div>
    <div class="gallery">${list.map(p => `<button type="button" class="ph" data-photo-id="${esc(p.id)}"><img data-photo="${esc(p.filename)}" alt="${esc(p.caption || p.kind)}"><span>${esc(p.caption || p.kind)}</span></button>`).join("") || '<p class="muted">No photos yet.</p>'}</div></section>
    ${receipts.length ? `<section><h2>Receipts</h2><div class="gallery">${receipts.map(s => `<button type="button" class="ph" data-edit-service="${esc(s.id)}"><img data-photo="${esc(s.receipt)}" alt="Receipt"><span>${fmtDate(s.date)} · ${fmtMoney(s.cost)}</span></button>`).join("")}</div></section>` : ""}`;
}
function photoSheet(b, p) {
  openSheet(`${head(p.caption || p.kind)}<img data-photo="${esc(p.filename)}" alt="" class="big">
    <form class="form" id="phf"><label class="f">Caption<input id="pc" value="${esc(p.caption)}"></label>
    <label class="f">Kind<select id="pk">${PHOTO_KINDS.map(k => `<option${k === p.kind ? " selected" : ""}>${k}</option>`).join("")}</select></label>
    <button class="btn">Save</button><button class="btn danger" type="button" id="pdel">Delete photo</button></form>`, el => {
    loadPhotos(el);
    el.querySelector("#phf").onsubmit = e => { e.preventDefault(); p.caption = el.querySelector("#pc").value.trim(); p.kind = el.querySelector("#pk").value; closeSheet(); changed(b) };
    confirmDelete(el.querySelector("#pdel"), async () => {
      b.photos = b.photos.filter(x => x.id !== p.id); closeSheet(); changed(b); toast("Photo deleted");
      try { await api(`storage/v1/object/garage/${S.session.id}/${encodeURIComponent(p.filename)}`, { method: "DELETE", token: await freshToken() }) } catch {}
    });
  });
}
async function addPhoto(b) {
  const file = await pickPhoto(); if (!file) return;
  toast("Uploading…");
  try { const name = await uploadPhoto(file); b.photos.push({ id: uuid(), filename: name, caption: "", date: iso(new Date()), kind: "General" }); changed(b); toast("Photo added") }
  catch (err) { toast(err.message || "Upload failed") }
}

// ---------- Account ----------
function accountSheet() {
  if (!cloudReady) { openSheet(`${head("Online sync")}<p class="muted">Online sync isn't set up yet.</p>`); return }
  if (S.session) {
    const when = S.lastSync ? `Last synced ${new Date(S.lastSync).toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit" })}.` : "Not synced yet.";
    openSheet(`${head("Online sync")}<div class="card form"><div class="t">Signed in with your passkey</div>
      <p class="small muted" style="margin:0">${when}${lastError ? ` <span style="color:var(--over)">${esc(lastError)}</span>` : ""} Changes upload a moment after you make them, and this page checks for changes from your Mac every 15 seconds while it's open.</p>
      <button class="btn" data-act="sync" type="button">Sync now</button><button class="btn ghost" data-act="newBike" type="button">Add bike</button>
      <button class="btn ghost" data-act="addPasskey" type="button">Add another passkey</button><button class="btn ghost" data-act="signout" type="button">Sign out</button>
      <button class="btn danger" data-act="signoutAll" type="button">Sign out on every device</button>
      <p class="small muted" style="margin:0">Lost a phone or laptop? "Sign out on every device" ends Garagebook's sign-in everywhere, including the Mac app. Sign in again with your passkey afterwards.</p></div>`);
    return;
  }
  openSheet(`${head("Sign in")}<div class="card form">
    <p class="muted" style="margin:0">Garagebook signs in with a passkey. It's saved in iCloud Keychain, so the same one works on your iPhone and Mac. No password.</p>
    <button class="btn" type="button" id="pkIn">Sign in with passkey</button>
    <button class="btn ghost" type="button" id="pkNew">Create passkey (first time)</button>
    <p class="small muted" id="aNote" style="margin:0"></p></div>`, el => {
    const note = el.querySelector("#aNote"), btns = el.querySelectorAll("button.btn");
    const go = async (work, label) => {
      btns.forEach(b => b.disabled = true); note.textContent = label;
      try { keepSession(await work()); await firstSync(); closeSheet(); toast("Signed in") } catch (err) { note.textContent = passkeyMessage(err) }
      btns.forEach(b => b.disabled = false);
    };
    el.querySelector("#pkIn").onclick = () => go(passkeySignIn, "Waiting for your passkey…");
    el.querySelector("#pkNew").onclick = () => go(passkeyCreate, "Creating your passkey…");
  });
}
async function addPasskey() {
  try { await passkeyCreate(); toast("Passkey added") } catch (err) { toast(passkeyMessage(err)) }
}
function appLoginScreen() {
  document.querySelector(".top").hidden = true; $("#tabs").hidden = true;
  $("#view").innerHTML = `<section style="margin-top:12vh"><div class="card form"><h2>Sign in the Mac app</h2>
    <p class="muted" style="margin:0">This gives the Garagebook app on this Mac access to your online garage. Only continue if you just pressed <b>Sign in with passkey</b> in Garagebook on your Mac.</p>
    <button class="btn" type="button" id="macIn">Sign in with passkey</button><p class="small muted" id="macNote" style="margin:0"></p></div></section>`;
  $("#macIn").onclick = async () => {
    const note = $("#macNote"); note.textContent = "Waiting for your passkey…";
    try { handBack(await passkeySignIn(appLogin.cc)); note.textContent = "Signed in. Going back to the Mac app…" } catch (err) { note.textContent = passkeyMessage(err) }
  };
}

function bikeSheet() {
  openSheet(`${head("Add bike")}<form class="form" id="bk">
    <label class="f">Name<input id="bn" required placeholder="e.g. Yamaha MT-07"></label>
    <div class="fields2"><label class="f">Year<input id="by" inputmode="numeric"></label><label class="f">Distance<select id="bu"><option>km</option><option>mi</option></select></label></div>
    <div class="fields2"><label class="f">Bought on<input id="bd" type="date"></label><label class="f">Price<input id="bp" inputmode="decimal"></label></div>
    <button class="btn">Add bike</button><p class="small muted" style="margin:0">It starts with a basic schedule. Import the booklet in the Mac app for the full one.</p></form>`, el => {
    el.querySelector("#bk").onsubmit = e => {
      e.preventDefault(); const km = el.querySelector("#bu").value === "km", k = v => km ? v : Math.round(v / 1.609344 / 500) * 500;
      const iv = (task, d, m) => ({ id: uuid(), task, ...(d ? { everyDistance: k(d) } : {}), ...(m ? { everyMonths: m } : {}) });
      const yr = parseInt(el.querySelector("#by").value), bd = el.querySelector("#bd").value, bp = num(el.querySelector("#bp").value);
      const b = { id: uuid(), updatedAt: iso(new Date()), name: el.querySelector("#bn").value.trim(), make: "", model: "", vin: "", plate: "", unit: km ? "km" : "mi", story: "",
        ...(yr ? { year: yr } : {}), ...(bd ? { purchaseDate: iso(fromDateInput(bd)) } : {}), ...(bp != null ? { purchasePrice: bp } : {}),
        odometer: [], services: [], fuel: [], mods: [], papers: [], wear: [], checklists: [], restoration: [], shopping: [], photos: [],
        intervals: [iv("Oil and filter", 5000, 12), iv("Chain clean and lube", 1000, 1), iv("Air filter", 10000, 24), iv("Spark plugs", 13000, 24), iv("Brake fluid", null, 24), iv("Coolant", null, 24), iv("Valve clearance check", 24000, null)] };
      S.file.bikes.push(b); S.bike = b.id; closeSheet(); changed(b); toast("Bike added");
    };
  });
}

// ---------- Events ----------
$("#bike").addEventListener("change", e => { S.bike = e.target.value; persist(); render() });
$("#syncChip").addEventListener("click", accountSheet);
$("#tabs").addEventListener("click", e => { const t = e.target.closest("button")?.dataset.tab; if (t) { S.tab = t; persist(); render(); scrollTo(0, 0) } });
document.addEventListener("click", e => {
  const b = bike(), a = e.target.closest("[data-act]")?.dataset.act, go = e.target.closest("[data-go]")?.dataset.go;
  if (go) { S.tab = go; persist(); render(); scrollTo(0, 0); return }
  if (a === "account") return accountSheet();
  if (a === "sync") return sync();
  if (a === "signout") return signOut();
  if (a === "signoutAll") { if (confirm("Sign out of Garagebook on every device, including the Mac app?")) return signOut(true); return }
  if (a === "newBike") return bikeSheet();
  if (a === "addPhoto") return addPhoto(b);
  if (a === "addPasskey") return addPasskey();
  const ph = e.target.closest("[data-photo-id]")?.dataset.photoId; if (ph) return photoSheet(b, b.photos.find(x => x.id === ph));
  if (a === "newService") return serviceSheet(b);
  if (a === "newPaper") return paperSheet(b);
  const o = e.target.closest("[data-edit-odo]")?.dataset.editOdo; if (o) return odoSheet(b, b.odometer.find(r => r.id === o));
  const f = e.target.closest("[data-edit-fuel]")?.dataset.editFuel; if (f) return fuelSheet(b, b.fuel.find(r => r.id === f));
  const s = e.target.closest("[data-edit-service]")?.dataset.editService; if (s) return serviceSheet(b, b.services.find(r => r.id === s));
  const p = e.target.closest("[data-edit-paper]")?.dataset.editPaper; if (p) return paperSheet(b, b.papers.find(r => r.id === p));
});
document.addEventListener("submit", e => {
  const b = bike();
  if (e.target.id === "odoForm") { e.preventDefault(); const v = num($("#odoVal").value); if (v == null) return; clearDraft("odoForm");
    b.odometer.push({ id: uuid(), date: iso(fromDateInput($("#odoDate").value)), value: v }); changed(b); toast(`Saved ${fmtNum(v)} ${esc(b.unit)}`) }
  if (e.target.id === "fuelForm") { e.preventDefault(); const a = num($("#fOdo").value), v = num($("#fVol").value), t = num($("#fTot").value); if ([a, v, t].includes(null)) return;
    clearDraft("fuelForm"); b.fuel.push({ id: uuid(), date: iso(fromDateInput($("#fDate").value)), odometer: a, volume: v, total: t, full: $("#fFull").checked }); changed(b); toast("Fill saved") }
});
if (appLogin) appLoginScreen(); else { render(); sync() }
</script>
</body>
</html>
